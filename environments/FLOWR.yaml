# FLOWR - derived from upstream's environment.yml (jule-c/flowr) with the notebook UI, plinder and the training-only trackers removed.
# The torch 2.5.1 stack, with torchdata 0.8.0, lightning 2.5.0 and torchmetrics 1.6.1, is upstream's own and is kept as it is.
name: FLOWR
channels:
  - conda-forge
  - pytorch
  - pyg
  - nvidia
  - mx
  - schrodinger
dependencies:
  - python=3.11
  - pip
  - matplotlib
  - xtb
  - vina
  - conda-forge::openmm
  - conda-forge::openff-toolkit
  - conda-forge::openmmforcefields
  - conda-forge::cudatoolkit=11.8
  - pytorch::pytorch=2.5.1
  # Selects the CUDA 11.8 build of pytorch; upstream's file leaves the solver free to pick the CPU build.
  - pytorch-cuda=11.8
  - conda-forge::rdkit=2023.9.6
  - conda-forge::lightning=2.5.0
  - conda-forge::openbabel
  - conda-forge::prody
  - conda-forge::pypdb
  - conda-forge::datamol
  - conda-forge::py3dmol
  - conda-forge::setuptools=65.6.3
  - conda-forge::scipy==1.11.4
  - mx::reduce
  - conda-forge::biopython=1.81
  - conda-forge::mdanalysis=2.7.0
  - conda-forge::pdbfixer
  - conda-forge::nglview
  # upstream's generate_from_pdb.py imports pymol at module level, and pymol's C extension links libGL.so.1.
  - pymol-bundle
  - libgl
  - pyyaml
