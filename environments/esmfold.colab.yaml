# ESMFold - colab/micromamba variant.
# Mirrors the recipe used by sokrypton's ColabFold ESMFold notebook
# (https://colab.research.google.com/github/sokrypton/ColabFold/blob/main/ESMFold.ipynb),
# which is the de-facto known-working Colab install. Key difference vs.
# esmfold.cluster.yaml: uses the sokrypton/openfold and sokrypton/esm forks.
#
# The openfold fork compiles a CUDA kernel whenever it sees an nvcc, and torch
# 2.1.2+cu121 (esmfold.pip.colab.1.txt) accepts only a CUDA 12.1 nvcc. Colab's image
# moved to nvcc 13.0 and gcc 13, which fail both checks ("detected CUDA version
# mismatches", then "_Float32 is undefined" in gcc 13's headers). The env therefore
# carries its own nvcc 12.1 and gcc 11, and the install script points CUDA_HOME, CC
# and CXX at them while pip builds openfold.
#
# All pip-installed deps (torch, esm, openfold, ...) live in esmfold.pip.colab.<N>.txt.
name: esmfold
channels:
  - nvidia/label/cuda-12.1.1
  - conda-forge
dependencies:
  - python=3.9
  - pip
  - setuptools=59.5.0
  - cuda-nvcc=12.1
  - cuda-cudart-dev=12.1
  - cuda-libraries-dev=12.1
  - gxx_linux-64=11
  - gcc_linux-64=11
