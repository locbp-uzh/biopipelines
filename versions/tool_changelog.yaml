RFdiffusion:
  files:
  - biopipelines/rfdiffusion.py
  - pipe_scripts/pipe_rfdiffusion_table.py
  current: "2.5"
  history:
  - version: '2.5'
    date: '2026-10-30'
    note: >-
      The `structures.id` column of `structures_map.csv` is written from the input stream's own ids and the suffix pattern the declared ids use (`combinatorics.multiplied_id_parents`), looked up by exact id. It was recovered by stripping a regex off each file id, so a file that is no input's output (a leftover `<id>.pdb`) got a parent that was merely its name with the last number cut off. Such a file now has a blank parent and is named in the step log, and a folder in which no file matches fails the step instead of writing a column of blanks. The declared ids and the column for every design the step makes are unchanged. Fold conditioning (`scaffold_dir`, `target_ss`, `target_adj`) never reads `pdb`, so it writes no parent column.
  - version: '2.4'
    date: '2026-09-30'
    note: >-
      Fixes 2.3, which raised `AttributeError: 'RFdiffusion' object has no attribute 'pdb'` at configuration time for every call -- with or without a pdb= input -- so the tool could not be constructed at all. 2.3 passed `self.pdb` to the missing-manifest helpers, but __init__ only ever stored `self.pdb_stream`; the original argument was discarded, and it is the one that matters, since the upstream `missing` table hangs off the output's `.tables` and the extracted DataStream does not carry them. The argument is now kept as `self.pdb_input` and both call sites use it, so the manifest is found rather than merely not crashing. The `missing` table is documented in docs/tool/structure_generation.md, which 2.3 also omitted.
  - version: '2.3'
    date: '2026-09-28'
    note: >-
      Propagates the upstream `missing` manifest, and declares a `missing` table when an input axis carries one. An upstream filter drops ids at execution time, after this step's outputs have been declared, so without the manifest the completion check counted those ids as outputs still owed and marked the step FAILED — for inputs it had already, correctly, skipped with a "File not found for ID" warning. A Panda pool filtered to 3 of 5 structures produced all 300 intended backbones with the right contigs and still reported "301 of 501 declared outputs found", which then blocked every dependent batch behind it.
  - version: '2.2'
    date: '2026-09-08'
    note: >-
      Types `contigmap.length`, which the upstream config has always carried and the wrapper did not expose. It constrains the total output length while each diffused segment keeps its own range, so a two-linker contig can admit an asymmetric split without admitting the degenerate one: `4-1/.../1-4` with the total pinned to five accepts (1,4) and (4,1) and rejects (1,1) and (4,4). Reachable before only through the untyped-keyword passthrough added in 2.1, which gave no validation and no record in the step config.
  - version: '2.1'
    date: '2026-09-02'
    note: >-
      Forwards constructor keywords it does not type onto the upstream command line, so an advanced user can reach an option the wrapper never curated. Declares `FORWARD_UNKNOWN_KWARGS` with its upstream CLI dialect — hydra `key=value` for the RFdiffusion family, argparse `--key value` for the MPNN family — and every forwarded key and value is validated at construction time through the same denylist as any other freeform string, then emitted double-quoted and echoed into the step log so a forwarded flag is visible rather than silent. A leftover key within the similarity cutoff of a real parameter name is reported as a probable misspelling naming the candidate, and still forwarded rather than dropped.
  - version: '2.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.
  - version: '1.1'
    date: '2026-06-30'
    note: >-
      Helper arguments moved from positional CLI into a JSON config file passed to the resolver script; generated bash changed, no user-facing parameter change.

RFdiffusion3:
  files:
  - biopipelines/rfdiffusion3.py
  - pipe_scripts/pipe_rfdiffusion3_build_inputs.py
  - pipe_scripts/pipe_rfdiffusion3_postprocess.py
  - pipe_scripts/pipe_rfdiffusion3_table.py
  current: "3.10"
  history:
  - version: '3.10'
    date: '2026-10-30'
    note: >-
      The `structures.id` column of `structures_map.csv` is written from the input stream's own ids and the suffix pattern the declared ids use (`combinatorics.multiplied_id_parents`), looked up by exact id. It was recovered by stripping a regex off each file id, so a file that is no input's output (a leftover `<id>.pdb`) got a parent that was merely its name with the last number cut off. Such a file now has a blank parent and is named in the step log, and a folder in which no file matches fails the step instead of writing a column of blanks. The declared ids and the column for every design the step makes are unchanged. A `prefix` is handed to the helper as the name the outputs carry in front of the parent, instead of being escaped into a regex.
  - version: '3.9'
    date: '2026-10-29'
    note: >-
      One input that cannot be designed no longer ends the step with no record of it. A batch with one contig that did not fit its structure lost that input silently: the post-processing only knew the files rfd3 had written, so the input had no row in `structures` and none in `missing`, and the step was marked FAILED for files nothing explained. What was asked for (one design key per input, `num_designs` x `num_models` outputs each) is now known before rfd3 runs. Each input is built once through rfd3's own `DesignInputSpecification`, so a spec its structure does not fit is that input's failure with upstream's message and is left out of the JSON; a design rfd3 was given and did not write, or whose archive cannot be read, is a failure too. Every failed design is a `kind="failure"` row in the new `missing` table under its own id, with the line of rfd3's output that names it, else rfd3's exit status and last line, as the cause; it keeps a row in `structures` (`status` `failed`), `metrics` and `specifications`, and the other designs are made as before. The step exits non-zero only when nothing was attempted or every design failed, and the upstream manifests are propagated into `missing`. The completion check still marks the step FAILED for a declared structure file of a failed design, since it does not excuse a `failure`. `partial_t` with `select_fixed_atoms` unset or True is refused: upstream fixes every input atom by default and does not noise a fixed atom, so the run returned the input (C-alpha RMSD 0.02 A). The `seed` is documented for what it does: it is passed to rfd3 as `seed=<n>` and fixes the random inputs, but rfd3's GPU reductions are nondeterministic and the same seed gave 2.1 and 1.4 A between repeats, so it does not reproduce a design.
  - version: '3.8'
    date: '2026-10-29'
    note: >-
      A fresh `foundry` env resolved atomworks 3.x, in which `rfd3.engine` does not import (`get_inferred_polymer_bonds` moved), and the install check (`import foundry`) still passed. The env spec now keeps `atomworks[ml]<3` and the install check imports `rfd3.engine`.
  - version: '3.7'
    date: '2026-10-09'
    note: >-
      `prefix` reaches the output ids when a PDB input is given. It was consulted only in the de-novo branch: with `pdb=`, each design key was the input pdb id alone, so every step sharing one input emitted the same `<pdb>_1 ... <pdb>_N`. Nothing failed at the time, since each step writes its own folder -- the loss appears only when the steps are pooled, where N steps collapse onto N ids and everything but the last is silently dropped. One real run put 3,700 designs onto 100 ids and was recovered only from the per-step tables. The design key is now `<prefix>_<pdb id>`, built by the runtime inputs builder (new `--key-prefix`), matched by the declared ids, and stripped along with the design suffix when structures_map.csv recovers each design's parent, so provenance is unchanged. Without a prefix the keys and ids are exactly as before.
  - version: '3.6'
    date: '2026-09-23'
    note: >-
      The element repair no longer corrupts a spec-compliant PDB. It assumed Biopython's PDBIO writes segID/element/charge one column early, which holds through 1.86; 1.87 writes the spec layout, so the repair read blanks, fell back to the atom name, and made every alpha carbon calcium and every SI a sulfur. The layout is now read off the installed PDBIO's format string (line length as fallback), and a blank element follows the PDB atom-name convention. Separately, a `/0` chain break or a `\0` inside `json_config` is now seen: only `contig` was inspected, so a multi-chain design given through `json_config` declared bare structure ids against per-chain rows and a consumer folded zero designs.
  - version: '3.5'
    date: '2026-09-19'
    note: >-
      Multi-chain contigs. The wrapper rejected any contig containing `/` and documented a backslash-zero
      as the chain-break token; foundry's parser accepts neither spelling, so a binder design --
      every design with more than one chain -- could not be expressed at all. `/0` is now the
      documented and accepted token. Separately, Biopython's PDBIO writes five spaces after the
      B-factor where the spec has six, shifting segID, element and charge one column left for every
      downstream reader; those columns are repaired and CONECT records are emitted for HETATM
      pairs, so a ligand keeps its bonds.
      The `sequences` stream now declares one id per chain, matching the rows
      pipe_rfdiffusion3_postprocess.py writes: a contig carrying `/0` declares the lazy
      `<id>[_<?>]`, covering both the suffixed rows of a multi-chain design and the bare id
      written for a single-chain one. Declaring bare structure ids made a downstream
      selection match nothing, so a consumer folded zero designs and reported no error.
  - version: '3.4'
    date: '2026-09-11'
    note: >-
      drops its private copy of the contig normalization for the shared `resolve_table_reference`. The copy read `value[0].info.path`, so the documented `(path, "column")` pair raised `AttributeError` instead of resolving.
  - version: '3.3'
    date: '2026-09-07'
    note: >-
      Reads the postprocess PYTHONPATH shim from `tool_overrides.rfdiffusion3.postprocess_pylibs` instead of the `RFDIFFUSION3_POSTPROCESS_PYLIBS` environment variable, so the Daint case -- postprocess running inside the RFD3 container, where the activated venv resolves to the container interpreter and biopython is not importable -- is configured rather than exported into the job. Docstrings also construct the internal code-only ligand as `Ligand(codes=...)`; they said `Ligand(hetatm_code=...)`, announced in the changelog and never shipped, so the call raises.
  - version: '3.2'
    date: '2026-09-02'
    note: >-
      Accepts `contigs` as a first-class synonym for `contig`, the spelling its three sibling wrappers use. Previously `RFdiffusion3(contigs=...)` was accepted, left `contig` empty, discarded the motif specification, and generated unconditioned de-novo backbones. Also corrects docstring examples and two validation hints that showed a `Ligand` combination the constructor rejects outright.
  - version: '3.1'
    date: '2026-09-02'
    note: >-
      Forwards constructor keywords it does not type onto the upstream command line, so an advanced user can reach an option the wrapper never curated. Declares `FORWARD_UNKNOWN_KWARGS` with its upstream CLI dialect — hydra `key=value` for the RFdiffusion family, argparse `--key value` for the MPNN family — and every forwarded key and value is validated at construction time through the same denylist as any other freeform string, then emitted double-quoted and echoed into the step log so a forwarded flag is visible rather than silent. A leftover key within the similarity cutoff of a real parameter name is reported as a probable misspelling naming the candidate, and still forwarded rather than dropped.
  - version: '3.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.
  - version: '2.1'
    date: '2026-08-31'
    note: >-
      contig accepts a (TableInfo, column) reference in addition to a literal, resolved per input structure in one pass by the inputs builder rather than once per id in generated bash.
  - version: "2.0"
    date: "2026-06-10"
    note: >-
      Cover the full RFD3 paper example set: add symmetry, unindex
      (atomic-motif enzyme), select_unfixed_sequence, select_partially_buried,
      redesign_motif_sidechains, ori_token/infer_ori_strategy (COM),
      is_non_loopy, plddt_enhanced, partial_t input-spec keys, plus
      inference-sampler overrides cfg/cfg_scale/step_scale/noise_scale/
      num_steps/center_option/seed.

