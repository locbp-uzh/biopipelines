Ligand:
  files:
  - biopipelines/ligand.py
  - pipe_scripts/pipe_ligand.py
  current: "1.5"
  history:
  - version: '1.5'
    date: '2026-09-23'
    note: >-
      Records a change that shipped in 1.5.0 under an unchanged 1.4, so 1.4 names two behaviours; runs from 1.5.0 recording Ligand 1.4 already have it. SMILES conformers keep the ETKDG geometry when MMFF puckers a ring system the embedder made planar (measured on the SiR silicon-xanthene core: 0.005 A after ETKDG, 1.13 A after MMFF, with MMFFHasAllMoleculeParams true), because GNINA docks rings as rigid and would take the broken shape as given. Drug-like ligands whose rings MMFF keeps flat are unaffected.
  - version: '1.4'
