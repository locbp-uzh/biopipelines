    date: '2026-09-05'
    note: >-
      The pocket metrics never reached the tables. fpocket indents every metric line with a tab, so splitting the raw line on its first tab read an empty key and stored the whole line under it: `druggability`, `volume` and `n_alpha_spheres` came out blank in `pockets.csv` and `top_druggability`/`top_volume` were reported as 0 for every structure, while the row counts and the pocket PDBs looked correct. The key normalization was wrong independently -- it replaced spaces before stripping the colon, so `Druggability Score :` became `druggability_score_` and would have missed the lookup even with the tab fixed. Measured on a cluster run of 1ubq, whose pocket 1 fpocket scores at druggability 0.235 and volume 550.097.
