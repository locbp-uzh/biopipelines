    date: '2026-09-04'
    note: >-
      `bonds=` no longer dies on a NameError. `pipe_placer_driver.py` called `json.load` to read the bonds JSON without importing `json`, so every run using the covalent-bond tethering the wrapper documents crashed on a name the module never bound. Investigated alongside this for a predict-versus-produce mismatch and found none: the constructor accepts only a DataStream or StandardizedOutput, so a Bundle/Each wrapper is refused before any id is predicted, both axes are always iterated, and the driver's flat product is exactly what the framework composes -- verified equal for every reachable combination including the no-ligand degradation to a bare structure id. The composition moved into a named `compose_output_id`, the single place to switch to `predict_single_output_id` if that guard ever widens.
  - version: '2.0'
