AlphaFold:
  files:
  - biopipelines/alphafold.py
  - pipe_scripts/pipe_alphafold_confidence.py
  - pipe_scripts/pipe_alphafold_msas.py
  - pipe_scripts/pipe_alphafold_queries.py
  - pipe_scripts/pipe_unsanitize_ids.py
  current: "1.15"
  history:
  - version: '1.15'
    date: '2026-10-29'
    note: >-
      `msas=` is matched to the queries through the shared `MsaLookup`, and a query with no alignment, which colabfold_batch left out of the folder it reads without a word, is a `failure` row in `missing` and a blank row of `confidence`; the other queries run. The `msas` table drops the `sequences.id` column that repeated its id. `pipe_boltz_msa_copy.py`, which stages the alignments, joins the files this tool owns.
  - version: '1.14'
    date: '2026-10-29'
    note: >-
      With `num_relax` above 0 the confidence table had two rows for each id: ColabFold writes a relaxed and an unrelaxed rank_001 model that share one scores JSON, and the extraction script made a row for each pdb file. It keeps one row per id now (the structure file was already the relaxed one). The documentation also says how to reach single-sequence mode, which has no parameter of its own: forward ColabFold's dashed flag as `**{"msa-mode": "single_sequence"}`, since `msa_mode=` reaches colabfold_batch with an underscore and is rejected.
  - version: '1.13'
    date: '2026-10-27'
    note: >-
      Reading the confidence scores no longer breaks when the run folder or a sequence id contains `_relaxed_` or `.pdb`. The scores file name was derived by replacing those fragments anywhere in the full path, so such a path pointed at a file that does not exist and the id lost its confidence row. Only the basename is rewritten now.
  - version: '1.12'
    date: '2026-10-27'
    note: >-
      New `pae` output stream: the ColabFold scores JSON of each best model, copied to `pae/<id>.json`, so a downstream tool can read the full predicted aligned error matrix (the `pae` key of that JSON) instead of only the `max_pae` scalar the confidence table keeps. The ids are the `structures` ids and `pae_map.csv` is written at runtime by pipe_alphafold_confidence.py for the ids whose JSON exists; the unsanitize pass renames the files and fixes the map for a bundled complex whose `+` ColabFold wrote as `_`. The JSON is copied as ColabFold wrote it, so a model without a PAE head (`--model-type alphafold2`) hands over a file with no `pae` key rather than failing the step. Nothing else changes: structures, msas, the confidence and missing tables and the ColabFold command are as before.
  - version: '1.11'
    date: '2026-10-14'
    note: >-
      `msas=` accepts a producer that emits a3m files without declaring an `msas` table. The staging step read `msas_input.tables.msas` unconditionally, so a `Scripting` step building alignments -- single-sequence ones, for instance -- raised `AttributeError: No table named 'msas'` at configuration time and no pipeline was generated. It now falls back to the msas stream's own map table, which carries the id|file the copier reads, and raises a named error if neither exists.
  - version: '1.10'
    date: '2026-10-13'
    note: >-
      The filtered-queries materialization excuses ids an upstream tool dropped on purpose. It projected the map table onto the stream's config-time ids and raised `KeyError: ids absent from map_table` for any id the run had legitimately filtered out -- a ProteinMPNN batch that sampled the same sequence twice drops the duplicate and records it in its `missing` manifest, and Pool merges that manifest correctly, but the materializer never read it. Two duplicates out of 2,800 sequences stopped a whole campaign at the MSA step. The upstream manifests are now passed to the materializer, which omits excused ids and still raises for an id that is absent with no manifest entry explaining it.
  - version: '1.9'
    date: '2026-09-29'
    note: >-
      The venv install route (the aarch64 one, where LocalColabFold's x86-only installer cannot be used) verifies that colabfold_batch actually runs, and skips only on the same evidence. It checked `import colabfold`, which loads the package __init__ and stays importable with alphafold-colabfold absent -- the conda route's own comment says why that is not sufficient, and the venv route had the weaker check anyway. A daint env installed from a pip file naming a mistyped extra therefore verified clean, reported "installation complete", and then short-circuited every later install with "already installed, skipping", while colabfold_batch raised "alphafold is not installed. Please run `pip install colabfold[alphafold]`" at import. Both the skip test and the verification now run `colabfold_batch --help`, which walks the whole model stack, plus the `import jax_cuda12_plugin` probe that catches a CPU-only jax; the failure branch prints what is missing instead of one line naming two possibilities. force_reinstall=True also removes the venv tree before rebuilding, since `python -m venv` over an existing directory leaves site-packages a different interpreter cannot read.
  - version: '1.8'
    date: '2026-09-27'
    note: >-
      Pre-computed `msas=` reach colabfold_batch. They were staged into the folding folder — which is where colabfold writes its own a3m — while the queries CSV stayed the input, and colabfold_batch reads alignments only from its input argument. So ColabFold ran its own MSA pipeline and queried the public server for every sequence while the staged files sat unread, making `msas=` a silent no-op for monomers. Supplied MSAs are now staged in `_execution/precomputed_msas` and that directory is passed as the input when `msas=` is set; behaviour is unchanged without it. Measured on an 8-sequence run: MSA-server submissions 8 → 0, polls 14 → 0, and folding from ~74 s to ~26 s per sequence.
  - version: '1.7'
    date: '2026-09-23'
    note: >-
      Pre-computed msas= are refused for a Grouped complex, as they already were for a Bundle: ColabFold folds a complex with its own paired+unpaired pipeline and never reads a per-chain a3m, so the MSAs were dropped with only a warning. A bare `Grouped(...)` input is also accepted now; the input resolver did not know the wrapper, so the constructor raised before any validation ran.
  - version: '1.6'
    date: '2026-09-21'
    note: >-
      Consumes a `Grouped` axis: a source tagged with a group stream has its rows collapsed into one iteration element per group, and its members are colon-joined into one ColabFold query, with a static partner appending one more chain after them. Before this, the only way to place several chains in one prediction was `Bundle`, which cannot express a partition — so a multi-chain inverse-folding design had no correct spelling at all. Group membership is resolved on the compute node by the framework's id matching, so the group ids are all that has to be known at configuration time.
      pipe_alphafold_queries.py is added to this tool's files, since no version gate covered it before.
  - version: '1.5'
    date: '2026-09-21'
    note: >-
      Fixes the confidence and msas tables recording paths that do not exist for any id ColabFold sanitizes. Its filenames cannot hold a `+`, so a bundled complex `barnase+barstar` comes back as `barnase_barstar`; the unsanitize pass renamed the files and rewrote the `id` column but left every other column alone, so confidence.structure pointed at the pre-rename basename and msas_map.csv kept both a sanitized `file` path and a sanitized `sequences.id`. Path and provenance columns are rewritten too now, comparing only string cells so a blank (which pandas reads as NaN, and NaN != NaN) is not counted as a change. Only multi-chain (Bundle) ids were affected -- a monomer id has nothing to sanitize. pipe_unsanitize_ids.py is added to this tool's files, since no version gate covered it before.
  - version: '1.4'
    date: '2026-09-20'
    note: >-
      Copies only the MSAs it is about to fold. The msas= stream is often wider than the query set -- a filtered stream, or a whole previous run recycled for one sequence -- and every a3m in it used to land in the directory ColabFold scans. The copy step now receives the queries CSV and restricts itself to those ids. Also drops the stale note that H100 is incompatible: that came from the cu11 jax pin, and folding on an H100 is verified with the CUDA 12 stack.
  - version: '1.3'
    date: '2026-09-20'
    note: >-
      Installs ColabFold 1.6.3 from pip instead of running LocalColabFold's install_colabbatch_linux.sh, which has been pinned to ColabFold 1.5.5 since January 2024. The env is a conda prefix at <AlphaFold>/colabfold-conda holding python, the pinned mmseqs2 build and pip-installed colabfold[alphafold,openmm] with jax[cuda12], so MMseqs2Server still finds colabfold_search and mmseqs where it always did. The skip check now runs `colabfold_batch --help` rather than `import colabfold`, and the run passes `--data <AlphaFoldParams>`.
  - version: '1.2'
    date: '2026-09-11'
    note: >-
      Map-table file column renamed to the canonical `file`: its `msas` map_table records the alignment path under `file`, not `msa_file`.
  - version: '1.1'
    date: '2026-09-04'
    note: >-
      Forwards unrecognized constructor kwargs onto `colabfold_batch`. The framework has not typed every upstream option and AlphaFold's surface is large, so an advanced user can now reach one directly instead of being told the kwarg was unknown.

