  files:
  - biopipelines/admet_ai.py
  - pipe_scripts/pipe_admet_ai.py
  current: "2.0"
  history:
  - version: '2.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.

AiZynthFinder:
  files:
  - biopipelines/aizynthfinder.py
  - pipe_scripts/pipe_aizynthfinder.py
  current: "2.5"
  history:
  - version: '2.5'
    date: '2026-10-29'
    note: >-
      The install check also imports pandas, yaml and rdkit, which the pipe script needs, beside `aizynthcli --help` and the config.yml check, in the shortcut and in the final verification.
  - version: '2.4'
    date: '2026-10-28'
    note: >-
      A step whose every target is unsanitizable exited with an error as it should, but before writing anything, so the ids that entered left no row in
      `targets` and none in `missing`; the tables are written before that exit now. `aizynthcli` ran in the repository folder, where it writes
      `aizynthcli<N>.log` when `nproc` is set, shared and overwritten by every run; it runs in the step's `_execution` folder now. The documentation named
      the `precursors` stream as feeding any compounds consumer, but a consumer reads the stream called `compounds`, so the example passes
      `azf.streams.precursors`. It now also says that `breadth_first` overruns `time_limit` (one iteration expands a whole level: 298 s and 480 s on a 30 s
      limit) and that a target nothing could be done with comes back as unsolved routes of zero steps, so `is_solved` has to be part of a selection by
      `number_of_steps`.
  - version: '2.3'
    date: '2026-10-28'
    note: >-
      A fresh install built an environment in which `aizynthcli` died on import with `pyarrow requires NumPy 2.0 or newer`: aizynthfinder needs numpy below 2, dask pulls the newest pyarrow and pyarrow 24 and later refuse numpy 1. The pip layer now holds `pyarrow<24` (23.0.1 and 21.0.0 were checked to import with numpy 1.26 and to start `aizynthcli`).
  - version: '2.2'
    date: '2026-10-27'
    note: >-
      Brought up to AiZynthFinder 4.x (4.4.1 checked). New optional parameters, all defaulting to what the config says: `search_algorithm` (`mcts`, `retrostar`, `breadth_first`, `dfpn`), `max_transforms`, `route_scorer` and `scorers` (four more scorers, each adding a `routes` column), `filter_cutoff`, `frozen_substructures` (the `frozen_substructure` filter) and `stock_stop_criteria`; existing parameters, defaults and table columns are unchanged. A target `aizynthcli` cannot set up (an unsanitizable SMILES) used to make it return fewer rows than targets, which aborted the step on the row count after the whole search had run; such targets are now screened with RDKit first, kept as empty `targets` rows and reported in `missing` as failures, and rows are matched to targets by the reported `target` SMILES when counts differ. The install keeps an existing env so a failed `download_public_data` can be retried, and verifies that `aizynthcli` starts rather than that the package imports.
  - version: '2.1'
    date: '2026-09-04'
    note: >-
      A lazy bracket that means a number now says `<#>` instead of `<N>`. Inside a bracket the token was already behaving as a wildcard -- the content is discarded, since a value unknown at configuration time cannot be narrowed there -- while outside a bracket `<N>` is the one-element set containing the letter N. Writing `<N>` for a number was therefore a lie that only happened to work. No behavioural change: the compiled regex is identical.
  - version: '2.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.
  - version: '1.0'
    date: '2026-07-23'
    note: Initial AiZynthFinder retrosynthesis wrapper.
  - version: '1.1'
    date: '2026-07-23'
    note: Parse aizynthcli's orient="table" JSON envelope; per-route scores from
      each tree's scores dict; split number_of_routes from number_of_returned_routes.
  - version: '1.2'
    date: '2026-07-27'
    note: Reject a bare string for stocks/expansion_policy/filter_policy instead of
      splitting it into characters; treat NaN as not-in-stock so an absent flag no
      longer marks a route solved.

