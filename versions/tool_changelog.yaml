AlphaFold:
  files:
  - biopipelines/alphafold.py
  - pipe_scripts/pipe_alphafold_confidence.py
  - pipe_scripts/pipe_alphafold_msas.py
  - pipe_scripts/pipe_alphafold_queries.py
  - pipe_scripts/pipe_unsanitize_ids.py
  current: "1.7"
  history:
  - version: '1.7'
    date: '2026-09-23'
    note: >-
      Pre-computed msas= are refused for a Grouped complex, as they already were for a Bundle: ColabFold folds a complex with its own paired+unpaired pipeline and never reads a per-chain a3m, so the MSAs were dropped with only a warning. A bare `Grouped(...)` input is also accepted now; the input resolver did not know the wrapper, so the constructor raised before any validation ran.
  - version: '1.6'
    date: '2026-09-21'
    note: >-
      Consumes a `Grouped` axis: a source tagged with a group stream has its rows collapsed into one iteration element per group, and its members are colon-joined into one ColabFold query, with a static partner appending one more chain after them. Before this, the only way to place several chains in one prediction was `Bundle`, which cannot express a partition — so a multi-chain inverse-folding design had no correct spelling at all. Group membership is resolved on the compute node by the framework's id matching, so the group ids are all that has to be known at configuration time.
      pipe_alphafold_queries.py is added to this tool's files, since no version gate covered it before.
  - version: '1.5'
    date: '2026-09-21'
    note: >-
      Fixes the confidence and msas tables recording paths that do not exist for any id ColabFold sanitizes. Its filenames cannot hold a `+`, so a bundled complex `barnase+barstar` comes back as `barnase_barstar`; the unsanitize pass renamed the files and rewrote the `id` column but left every other column alone, so confidence.structure pointed at the pre-rename basename and msas_map.csv kept both a sanitized `file` path and a sanitized `sequences.id`. Path and provenance columns are rewritten too now, comparing only string cells so a blank (which pandas reads as NaN, and NaN != NaN) is not counted as a change. Only multi-chain (Bundle) ids were affected -- a monomer id has nothing to sanitize. pipe_unsanitize_ids.py is added to this tool's files, since no version gate covered it before.
  - version: '1.4'
    date: '2026-09-20'
    note: >-
      Copies only the MSAs it is about to fold. The msas= stream is often wider than the query set -- a filtered stream, or a whole previous run recycled for one sequence -- and every a3m in it used to land in the directory ColabFold scans. The copy step now receives the queries CSV and restricts itself to those ids. Also drops the stale note that H100 is incompatible: that came from the cu11 jax pin, and folding on an H100 is verified with the CUDA 12 stack.
  - version: '1.3'
    date: '2026-09-20'
    note: >-
      Installs ColabFold 1.6.3 from pip instead of running LocalColabFold's install_colabbatch_linux.sh, which has been pinned to ColabFold 1.5.5 since January 2024. The env is a conda prefix at <AlphaFold>/colabfold-conda holding python, the pinned mmseqs2 build and pip-installed colabfold[alphafold,openmm] with jax[cuda12], so MMseqs2Server still finds colabfold_search and mmseqs where it always did. The skip check now runs `colabfold_batch --help` rather than `import colabfold`, and the run passes `--data <AlphaFoldParams>`.
  - version: '1.2'
    date: '2026-09-11'
    note: >-
      Map-table file column renamed to the canonical `file`: its `msas` map_table records the alignment path under `file`, not `msa_file`.
  - version: '1.1'
    date: '2026-09-04'
    note: >-
      Forwards unrecognized constructor kwargs onto `colabfold_batch`. The framework has not typed every upstream option and AlphaFold's surface is large, so an advanced user can now reach one directly instead of being told the kwarg was unknown.

