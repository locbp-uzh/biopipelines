LigandMPNN:
  files:
  - biopipelines/ligand_mpnn.py
  - biopipelines/chain_rows.py
  - pipe_scripts/pipe_lmpnn_runtime_positions.py
  - pipe_scripts/resolve_lmpnn_positions.py
  - pipe_scripts/pipe_fa_to_csv_fasta.py
  current: "3.0"
  history:
  - version: '3.0'
    date: '2026-09-23'
    note: >-
      No behavioural change: removes accepts_multiple from the shared biopipelines/chain_rows.py, which lost its last caller in the previous version.
  - version: '2.9'
    date: '2026-09-23'
    note: >-
      Naming several chains (chains=["A","B"]) no longer sets the default chain for an unqualified position selection to the first of them; the runtime reads it off each structure and refuses the ambiguous case, as for ProteinMPNN 2.8.
  - version: '2.8'
    date: '2026-09-23'
    note: >-
      The chain= deprecation line no longer claims the pipeline runs as written: chain= used to name the chain an unqualified selection belongs to and left every other chain fused in one sequence row, while chains= also decides which chains become rows, so chain="B" now emits chain B alone. Separately, equal-length chains are assigned by sequence identity to the input chains: both candidate orders matched by length and alphabetical always won, so a design written in appearance order (B before A) had its two sequences swapped under each other's chain letters. A tie that sequence cannot break is reported rather than resolved silently.
  - version: '2.7'
    date: '2026-09-21'
    note: >-
      Also collapses `chain` into `chains`: the two were one letter apart and meant different things -- which chains are emitted, versus which chain an unqualified position selection belongs to -- which is the `Ligand` `code`/`codes` mistake again. Naming the chains in play answers both, so there is one parameter; `chain=` binds it through `PARAMETER_ALIASES` and reports a `deprecated_alias` line. A chainless selection on a multi-chain structure now raises naming the chains, where ProteinMPNN attached it to whichever chain came first and LigandMPNN used the literal "A" -- silently wrong whenever the single chain was called anything else, and now read off each structure. `fixed` and `redesigned` accept a `{chain: selection}` dict, each value taking any form the parameter accepts, and the `sele.csv` summary is chain-aware as soon as more than one chain is in play.
  - version: '2.6'
    date: '2026-09-21'
    note: >-
      A design over a multi-chain backbone becomes one `sequences` row per chain instead of one row whose `sequence` fuses every chain behind a separator. LigandMPNN joins them with `:`; it shares the affected writer with ProteinMPNN, so it carried the same fault. A `sequences` row is one polymer chain, so that value reached every consumer as if it were one: Boltz2 wrote it into a single YAML chain entry, where Boltz mapped the separator to an `UNK` residue and folded a complex containing a chain that should not exist, reporting high confidence for it. The new `chains` parameter says which chains become rows -- `None` (the default) expects a single-chain backbone and records a multi-chain one as a failure in `missing.csv` naming the chains found, `"A"` emits just that chain with the ids it always had, `["A","B"]` emits `<design>_<chain>` ids, and `"all"` emits every chain behind a lazy `[_<?>]` pattern. Chain letters are resolved by matching each segment's length against the backbone's per-chain residue counts, and a design that cannot be reconciled is dropped rather than mislabelled. A new `designs` stream carries one row per design -- the ids the `sequences` stream used to have -- and is what `Grouped` groups the chain rows by to fold a complex. Single-chain pipelines are unaffected: same ids, same rows.
      Packed side-chain structures also fan out from the design ids rather than the chain rows, which are one per chain and would have over-counted them.
  - version: '2.5'
    date: '2026-09-04'
    note: >-
      The `run.py` command is emitted as a bash array instead of through `eval`, the last such site in the tree. The position resolver now prints NUL-separated argv tokens rather than a flag-plus-quoted-value line, which is what the `eval` existed to split, so a residue list containing a space survives as one argument without a second parse.
  - version: '2.4'
    date: '2026-09-03'
    note: >-
      The documented `(TableInfo, "column")` column-reference form now binds. Only a `TableReference` was recognised, so a tuple fell through to `json.dump` and raised `TypeError: Object of type TableInfo is not JSON serializable` from `generate_script` — after the whole pipeline had been configured. `fixed` and `redesigned` are normalized through the shared `resolve_table_reference`, which accepts a literal selection, a `TableReference`, a `(TableInfo, column)` tuple or a `(path, column)` pair, and refuses anything else at construction time naming the parameter.
  - version: '2.3'
    date: '2026-09-02'
    note: >-
      Documentation only: `Ligand(code=...)` in docstrings and user-facing error messages becomes `Ligand(codes=...)`, since the two parameters were unified and `code` is now a synonym that will soon be deprecated. No behavioural change; the version moves because the wrapper file did.
  - version: '2.2'
    date: '2026-09-02'
    note: >-
      Constructs its internal code-only `Ligand` with `codes=` rather than the now-deprecated `code=`. The bare-string `ligand="LIG"` shorthand is the documented form, so the deprecation notice it triggered named a call the user never made.
  - version: '2.1'
    date: '2026-09-02'
    note: >-
      Forwards constructor keywords it does not type onto the upstream command line, so an advanced user can reach an option the wrapper never curated. Declares `FORWARD_UNKNOWN_KWARGS` with its upstream CLI dialect — hydra `key=value` for the RFdiffusion family, argparse `--key value` for the MPNN family — and every forwarded key and value is validated at construction time through the same denylist as any other freeform string, then emitted double-quoted and echoed into the step log so a forwarded flag is visible rather than silent. A leftover key within the similarity cutoff of a real parameter name is reported as a probable misspelling naming the candidate, and still forwarded rather than dropped.
  - version: '2.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.
  - version: '1.3'
    date: '2026-08-31'
    note: >-
      Validates the packer parameters. packs_per_design reaches the generated bash and the <1..N> output id pattern, so a zero, a negative or a string surfaced as a broken pattern or a silently empty result instead of a named error at construction; the two packer booleans are type-checked rather than coerced.
  - version: '1.2'
    date: '2026-08-07'
    note: >-
      Added pack_side_chains, packs_per_design and pack_with_ligand_context, exposing upstream's side-chain packer. When enabled the tool gains a structures stream; without it LigandMPNN emits sequence only, so downstream structures keep the input rotamers under the new residue identities.
  - version: '1.1'
    date: '2026-06-30'
    note: >-
      Helper arguments moved from positional CLI into a JSON config file passed to the resolver script; generated bash changed, no user-facing parameter change.

Load:
  files:
  - biopipelines/load.py
  current: "1.4"
  history:
  - version: '1.4'
    date: '2026-09-11'
    note: >-
      Map-table file column renamed to the canonical `file`: refuses a map_table whose file column is a retired per-tool spelling instead of recovering a stream with no files from it.
  - version: '1.3'
    date: '2026-09-04'
    note: >-
      Matching ids to filenames now inverts the declared `<id>` file template instead of guessing from the basename. Wave 3 made exact basenames claim first, which covers `<id>.pdb` only; the three shipped suffixed templates (`<id>_best.pdb`, `<id>_A3D.csv`, `<id>_RMSF.csv`) never produce a basename equal to an id, so every id still fell through to substring matching -- measured, `design_1` was handed `design_10_best.pdb` while `design_1_best.pdb` went unused, and ids came back renamed to `design_1_A3D`. New `id_patterns.id_from_file_pattern` and `glob_from_file_pattern` provide the inverse and the candidate glob. A one-id templated stream also stopped taking the "already matched" shortcut, which reported it recovered without checking disk.
  - version: '1.2'
    date: '2026-09-02'
    note: >-
      Load recovers a partially-completed output folder instead of failing or answering wrongly. A declared-but-absent `missing.csv` — what a step killed mid-write leaves behind — raised `FileNotFoundError` and denied the user every id that step did produce; it is now reported and excuses nothing. Without a map_table the glob fallback matched `design_10` to `design_1.pdb` by substring and reported `design_1` twice, so exact basenames now claim first and one file serves one id. A readable map_table with zero rows is an answer, not an unresolved template. New `recovery` / `recovery_summary()` / `recovered_nothing` state what was recovered and what was not, and the step's `_COMPLETED`/`_FAILED` marker is read and surfaced. Also sets the derived job name via `name`, the key BaseConfig actually reads; it was passed as `job_name`, which was parked in `.params` and discarded, so every Load ran with an unnamed job.
  - version: '1.1'
    date: '2026-08-31'
    note: >-
      Reads a map_table with dtype=str and keep_default_na=False. Since the map became authoritative for stream ids, type inference renamed them -- a zero-padded 0001 loaded as 1 while its file stayed 0001.pdb, so every downstream join on id silently missed -- and it blanked real NA/nan strings. The rebasing path wrote that damage to disk. Path rebasing now matches whole path components, so a row pointing at a sibling run (Job_001_retry when Job_001 moved) is left alone, and it raises instead of silently keeping the old map when the rebased copy cannot be written.

MMseqs2:
  files:
  - biopipelines/mmseqs2.py
  - pipe_scripts/pipe_mmseqs2_sequences.py
  - pipe_scripts/mmseqs2_client.sh
  current: "1.8"
  history:
  - version: '1.8'
    date: '2026-09-20'
    note: >-
      output_format now decides the file the step emits, not only the format asked of the server. With output_format="a3m" the search result is written verbatim -- `#` meta line and `>` headers intact -- and the msas stream declares format="a3m", so it can be passed straight to AlphaFold with no MSA() conversion. The previous behaviour converted every result to `key,sequence` csv and discarded the headers, which are the only place the UniRef identifiers ColabFold pairs complex chains on are recorded. csv remains the default and is unchanged.
  - version: '1.7'
    date: '2026-09-20'
    note: >-
      Wording only: the messages naming the env that supplies colabfold_search and mmseqs now describe it as AlphaFold's ColabFold environment rather than LocalColabFold, which AlphaFold 1.3 no longer installs. No behavior change.
  - version: '1.6'
    date: '2026-09-11'
    note: >-
      Map-table file column renamed to the canonical `file`: its `msas` map_table declares one file column, the canonical `file`; it previously declared both `msa_file` and `file` and wrote only the former.
  - version: '1.5'
    date: '2026-09-02'
    note: >-
      No behavioural change; the version moves because the shared `mmseqs2.py` did. See the MMseqs2Server entry.
  - version: '1.4'
    date: '2026-08-31'
    note: >-
      submission_in_progress judges staleness from the lockdir, the same artifact acquire_submit_lock uses. Reading the marker's mtime instead left one state nobody could act on -- marker gone, lockdir present -- where every client saw no submission in progress, failed to acquire because the directory existed, and submitted nothing for the full 3h TTL.
  - version: '1.3'
    date: '2026-08-31'
    note: >-
      Behaves as a guest on the public ColabFold MSA server: sends a User-Agent identifying the lab, reads the submit response's status so a RATELIMIT or MAINTENANCE reply (both of which carry a ticket id) stops the run instead of polling a ticket that was never queued, and backs off with jitter rather than at a fixed 5s. A batch in which every sequence fails now exits non-zero; it previously wrote an empty MSA table at exit 0, which passed the completion check and let every downstream fold run single-sequence with nothing saying so.
  - version: '1.2'
    date: '2026-08-31'
    note: >-
      Corrects the 1.1 note, which describes behaviour this release removed. Alignments are paired by the query header inside each returned chunk, not by an integer alias parsed from the tar member name, and server_url no longer requires output_format="a3m" -- the step always declares and emits .csv, converting a3m on arrival, so output_format now selects only the wire format requested from the search. No behavioural change in this bump.
  - version: '1.1'
    date: '2026-07-27'
    note: Map remote-server alignments to queries by parsed integer alias, not by
      position in the lexically sorted tar members (past ten sequences "10" sorts
      before "2"); require output_format="a3m" with server_url.

MMseqs2Server:
  files:
  - biopipelines/mmseqs2.py
  - pipe_scripts/mmseqs2_server_gpu.sh
  current: "1.7"
  history:
  - version: '1.7'
    date: '2026-09-20'
    note: >-
      No change to the server. Version follows MMseqs2 1.8 because both classes live in biopipelines/mmseqs2.py and the edit-gate keys on the file, not the class.
  - version: '1.6'
    date: '2026-09-20'
    note: >-
      Wording only: the install check's error text now points at AlphaFold's ColabFold environment rather than LocalColabFold, which AlphaFold 1.3 no longer installs. The paths it probes are unchanged. No behavior change.
  - version: '1.5'
    date: '2026-09-11'
    note: >-
      Map-table file column renamed to the canonical `file`: same `msas` schema correction as MMseqs2, whose wrapper file it shares.
  - version: '1.4'
    date: '2026-09-02'
    note: >-
      Arms the cleanup trap before claiming the submission lock. The trap was registered after the ~271 s index load because `cleanup()` was defined below it, so a server dying in that window left its lockdir for the full 3 h TTL and suppressed every client's server — the 'died before ready' case cleanup's own comment claimed to handle. Deleting a peer's advertisement is now gated on the server having gone ready, which the earlier trap would otherwise have caused, and cleanup propagates the real exit code instead of a hardcoded 0, which would have turned every pre-ready failure into a reported success.
  - version: '1.3'
    date: '2026-08-31'
    note: >-
      No behavioural change; the version moves because the shared mmseqs2.py did. See the MMseqs2 entry.
  - version: '1.2'
    date: '2026-08-31'
    note: >-
      No behavioural change; the version moves because the shared mmseqs2.py did. Also registered in config.daint.yaml's environment block, which had omitted it and MMseqs2 despite documenting the CPU server on Daint in detail -- both worked there only via the implicit biopipelines fallback.
  - version: '1.1'
    date: '2026-08-31'
    note: >-
      Both server scripts release the submission lock however they exit. The GPU script trapped cleanup on SIGINT/SIGTERM but not EXIT, so under set -e a server dying during install or index load leaked the lock for its full 3h TTL. Both also removed the marker file before the lockdir, and a failed rmdir then left clients seeing no submission in progress and no acquirable lock -- every one of them logging that another client was submitting, and submitting nothing, until the TTL expired. The lockdir is now released first, so a failed rmdir leaves a marker that makes clients wait rather than no-op.

Mock:
  files:
  - biopipelines/mock.py
  - pipe_scripts/pipe_mock.py
  current: "1.5"
  history:
  - version: '1.5'
    date: '2026-09-04'
    note: >-
      A lazy bracket that means a number now says `<#>` instead of `<N>`. Inside a bracket the token was already behaving as a wildcard -- the content is discarded, since a value unknown at configuration time cannot be narrowed there -- while outside a bracket `<N>` is the one-element set containing the letter N. Writing `<N>` for a number was therefore a lie that only happened to work. No behavioural change: the compiled regex is identical.
  - version: '1.4'
    date: '2026-09-04'
    note: >-
      The static pattern agrees too. Recording only a per-axis mode was too coarse for `Bundle(Each(a), b)`, where the `Each` iterates while the bare sources ride along on every row: `get_mode` reports the outer wrapper as a bundle and hides the inner `Each`, so predict gave ['a1+b1', 'a2+b1'] while produce gave ['a1+a2+b1']. The axis metadata now records which streams iterate, which are static and which side of the id the static part lands on, and streams are identified by index rather than name because two in one axis may share one. All six axis shapes -- bare, Each, pure Bundle, both static orderings, and multi-axis -- now agree.
  - version: '1.3'
    date: '2026-09-04'
    note: >-
      Provenance is recorded while ids are composed instead of recovered by splitting them. `_rebuild_runtime_provenance` split the parent id on `+` and gave part i to axis i, but a bundled axis contributes several `+`-joined parts and the composer hoists it ahead of the iterated axes, so with Bundle(compounds) and Each(structures) the structures column was assigned a ligand id and the rest shifted behind it -- silently, into the column downstream joins on. Each axis's contribution is now kept from composition, matching the config-time declaration exactly including the per-member `<axis>.<n>` bundle columns. The positional path remains only as the fallback for a config written before axis metadata existed.
  - version: '1.2'
    date: '2026-09-04'
    note: >-
      Mock produces the ids it declares. `_collect_datastreams` flattened Bundle/Each away, so the config JSON carried no per-axis mode and the runtime composed ids with its own cartesian product over every axis: a bundled axis iterated instead of contributing one prefix, giving four outputs against two declared and a FAILED marker. The config now records each axis's mode and streams, and `pipe_mock.py` calls the framework's `predict_single_output_id` rather than its own loop. Configs written before this keep working, treating one stream as one iterated axis.
  - version: '1.1'
    date: '2026-09-02'
    note: >-
      Declares `USER_STREAM_NAMES = True`. Mock's stream names come from the user's `streams={...}` dict, so the framework's stream-name registry check cannot know them in advance and would report a documented feature. The format checks still apply. One declarative line; no change to generated scripts or outputs.

MSA:
  files:
  - biopipelines/msa.py
  - pipe_scripts/pipe_msa.py
  current: "1.2"
  history:
  - version: '1.2'
    date: '2026-09-20'
    note: >-
      Fixes the A3M header line, whose two fields were written in the wrong order. ColabFold splits it on tab and reads field 1 as the per-chain query length and field 2 as the chain cardinality; convert_csv_to_a3m wrote sequence-count first, so a 5162-row MSA of a 36-residue query emitted `#5162	36` and ColabFold parsed it as a complex of 36 chains of 5162 residues. This, not the absence of UniRef headers, is why A3M produced by MSA(convert="a3m") did not work in AlphaFold.
  - version: '1.1'
    date: '2026-09-11'
    note: >-
      Map-table file column renamed to the canonical `file`: its `msas` map_table records the converted alignment under `file`, not `msa_file`.

