RFdiffusion3:
  files:
  - biopipelines/rfdiffusion3.py
  - pipe_scripts/pipe_rfdiffusion3_build_inputs.py
  - pipe_scripts/pipe_rfdiffusion3_postprocess.py
  - pipe_scripts/pipe_rfdiffusion3_table.py
  current: "3.6"
  history:
  - version: '3.6'
    date: '2026-09-23'
    note: >-
      The element repair no longer corrupts a spec-compliant PDB. It assumed Biopython's PDBIO writes segID/element/charge one column early, which holds through 1.86; 1.87 writes the spec layout, so the repair read blanks, fell back to the atom name, and made every alpha carbon calcium and every SI a sulfur. The layout is now read off the installed PDBIO's format string (line length as fallback), and a blank element follows the PDB atom-name convention. Separately, a `/0` chain break or a `\0` inside `json_config` is now seen: only `contig` was inspected, so a multi-chain design given through `json_config` declared bare structure ids against per-chain rows and a consumer folded zero designs.
  - version: '3.5'
    date: '2026-09-19'
    note: >-
      Multi-chain contigs. The wrapper rejected any contig containing `/` and documented a backslash-zero
      as the chain-break token; foundry's parser accepts neither spelling, so a binder design --
      every design with more than one chain -- could not be expressed at all. `/0` is now the
      documented and accepted token. Separately, Biopython's PDBIO writes five spaces after the
      B-factor where the spec has six, shifting segID, element and charge one column left for every
      downstream reader; those columns are repaired and CONECT records are emitted for HETATM
      pairs, so a ligand keeps its bonds.
      The `sequences` stream now declares one id per chain, matching the rows
      pipe_rfdiffusion3_postprocess.py writes: a contig carrying `/0` declares the lazy
      `<id>[_<?>]`, covering both the suffixed rows of a multi-chain design and the bare id
      written for a single-chain one. Declaring bare structure ids made a downstream
      selection match nothing, so a consumer folded zero designs and reported no error.
  - version: '3.4'
    date: '2026-09-11'
    note: >-
      drops its private copy of the contig normalization for the shared `resolve_table_reference`. The copy read `value[0].info.path`, so the documented `(path, "column")` pair raised `AttributeError` instead of resolving.
  - version: '3.3'
    date: '2026-09-07'
    note: >-
      Reads the postprocess PYTHONPATH shim from `tool_overrides.rfdiffusion3.postprocess_pylibs` instead of the `RFDIFFUSION3_POSTPROCESS_PYLIBS` environment variable, so the Daint case -- postprocess running inside the RFD3 container, where the activated venv resolves to the container interpreter and biopython is not importable -- is configured rather than exported into the job. Docstrings also construct the internal code-only ligand as `Ligand(codes=...)`; they said `Ligand(hetatm_code=...)`, announced in the changelog and never shipped, so the call raises.
  - version: '3.2'
    date: '2026-09-02'
    note: >-
      Accepts `contigs` as a first-class synonym for `contig`, the spelling its three sibling wrappers use. Previously `RFdiffusion3(contigs=...)` was accepted, left `contig` empty, discarded the motif specification, and generated unconditioned de-novo backbones. Also corrects docstring examples and two validation hints that showed a `Ligand` combination the constructor rejects outright.
  - version: '3.1'
    date: '2026-09-02'
    note: >-
      Forwards constructor keywords it does not type onto the upstream command line, so an advanced user can reach an option the wrapper never curated. Declares `FORWARD_UNKNOWN_KWARGS` with its upstream CLI dialect — hydra `key=value` for the RFdiffusion family, argparse `--key value` for the MPNN family — and every forwarded key and value is validated at construction time through the same denylist as any other freeform string, then emitted double-quoted and echoed into the step log so a forwarded flag is visible rather than silent. A leftover key within the similarity cutoff of a real parameter name is reported as a probable misspelling naming the candidate, and still forwarded rather than dropped.
  - version: '3.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.
  - version: '2.1'
    date: '2026-08-31'
    note: >-
      contig accepts a (TableInfo, column) reference in addition to a literal, resolved per input structure in one pass by the inputs builder rather than once per id in generated bash.
  - version: "2.0"
