BindingData:
  files:
  - biopipelines/binding_data.py
  - pipe_scripts/pipe_binding_data.py
  current: "1.2"
  history:
  - version: '1.2'
    date: '2026-08-31'
    note: >-
      Records queried_utc and chembl_release on both output tables. These are snapshots of databases that grow with every release, so two runs months apart legitimately disagree and nothing in the output distinguished them; a reported affinity could not be traced to what produced it.
  - version: '1.1'
    date: '2026-08-31'
    note: >-
      Percent-encodes the SMILES ChEMBL's similarity and substructure endpoints take in the URL path. It was interpolated raw, and requests keeps '#' and '/' in its safe set, so 'C#N' truncated at the '#' -- everything after it, threshold included, became a client-side fragment and was never sent, leaving a similarity search for plain carbon -- and 'C/C=C/C' split into extra path segments. Adds a User-Agent identifying the lab, a ~3/s rate limit and retry-with-backoff on 429/503, so a throttled batch is retried rather than recorded as a batch of compounds with no known binder. An unrecognised BindingDB payload and an unparseable affinity value now raise or report no relation instead of being laundered into a scientific negative.

