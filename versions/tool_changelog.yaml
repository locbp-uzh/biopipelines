Foldseek:
  files:
  - biopipelines/foldseek.py
  - pipe_scripts/pipe_foldseek.py
  current: "1.4"
  history:
  - version: '1.4'
    date: '2026-10-29'
    note: >-
      Documentation only. States that below TM 0.5 the thresholds do nothing under the default E-value and coverage, and that `evalue`, `coverage` and `cov_mode` change that: on a test set `evalue=10, coverage=0.0` merged ubiquitin with GFP at TM 0.05 (4 clusters became 3), `cov_mode` changed the representatives, and in multimer mode `coverage=0.8, cov_mode=2` merged a complex with a monomer.
  - version: '1.3'
    date: '2026-10-29'
    note: >-
      The install check also imports pandas and yaml, which the pipe script needs, beside `foldseek version`, and the shortcut for an existing env runs both; it accepted any env that existed. An existing env that fails the check is no longer built over.
  - version: '1.2'
    date: '2026-10-29'
    note: >-
      A coverage below 1e-4 was written in exponent form (`1e-05`), which Foldseek's `-c` rejects; it is now written as a plain decimal.
  - version: '1.1'
    date: '2026-10-29'
    note: >-
      Adds `evalue` (`-e`), `coverage` (`-c`) and `cov_mode` (`--cov-mode`), passed to `easy-cluster` and to `easy-multimercluster`. Left unset, `evalue` and `coverage` emit no flag and `cov_mode` stays 0, so the command is the one 1.0 ran. Foldseek's own defaults differ by mode (single-chain `-e 0.01 -c 0.8`, multimer `-e 10 -c 0.0`), so 1.0's docs were wrong to say no coverage requirement was set for single chains. With `multimer=True`, `cov_mode` is limited to 0-2: Foldseek-Multimer applies `multimer_tm_threshold` in those modes only.
  - version: '1.0'
    date: '2026-10-27'
    note: >-
      Initial release. Clusters a structures stream with `foldseek easy-cluster` (single chains) or `foldseek easy-multimercluster` (complexes) once per TM-score threshold, and reports each structure's cluster number, representative and the cluster count of the whole set per threshold. Distinct from StructureCluster, which is a superposition-free proxy with per-family ranking.

