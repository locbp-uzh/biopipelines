RTMScore:
  files:
  - biopipelines/rtmscore.py
  - pipe_scripts/pipe_rtmscore.py
  current: "2.1"
  history:
  - version: '2.1'
    date: '2026-09-04'
    note: >-
      No defect found; the runtime pair id is documented rather than changed. RTMScore declares tables only and no streams, so nothing predicts its output ids and `pipe_check_completion` derives an empty declared-id list from it: the `<protein>+<ligand>` id is the scores table's join key and reaches no completion check. Its axes cannot be bundled either, since the constructor refuses a Bundle/Each wrapper, so both are always iterated and the flat product matches what the framework composer would produce. The composition moved into a named `compose_pair_id` recording that, plus the constraint that matters for anyone adding a predictor later: the id set is runtime-determined, because identical input id lists take the diagonal rather than the product.
  - version: '2.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.
  - version: '1.2'
    date: '2026-08-31'
    note: >-
      Scores the diagonal instead of the full cross product when the protein and ligand id lists are identical, which is the shape produced by carving each ligand from its own complex: 375 of 376 cross-product cells were scoring a pose against the wrong protein. The switch is documented as data-shape inference, and the cross product still runs whenever the id lists differ.
  - version: '1.1'
    date: '2026-06-30'
    note: >-
      Container-mode execution: the heavy binary now runs inside the configured .sif via container_prefix() when a container image is set, or in the host env otherwise; host-side orchestration stays in the activated env.

