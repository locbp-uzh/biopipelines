BioEmu2:
  files:
  - biopipelines/bioemu2.py
  - pipe_scripts/pipe_bioemu2.py
  current: "1.7"
  history:
  - version: '1.7'
    date: '2026-10-30'
    note: >-
      A run's `ligands.id` for a ligand axis with a static companion, `Bundle(Each(ligands), cofactor)`, is the ligand id alone, as the wrapper declares it. It was the companion joined to the ligand (`cof+l1`), which is no id of the compounds stream, so a join on `ligands.id` matched nothing. The provenance of a run comes from `combinatorics.predict_single_provenance` and the conformer ids `<run>_<k>` from `generate_multiplied_ids`, so the pipe script builds neither by hand.
  - version: '1.6'
    date: '2026-10-29'
    note: >-
      `msas` is matched through the shared `MsaLookup` (exact id, `sequences.id`, legacy `<id>_msa`, then the sequence), and the per-tool copy is gone. The documented partial mode stays, a sequence with no alignment is searched through ColabFold as usual, and the log now names each sequence that went that way with the ids that were present.
  - version: '1.5'
    date: '2026-10-29'
    note: >-
      Two things from the first cluster runs that had a failed run among good ones. The cause of a run whose `bioemu2 sample-equilibrium` call exited non-zero read "exited with status 1; see the step log", which names nothing; the call's output is now read as it is printed (the step log is the same stream, unbuffered so a traceback is not followed by stdout that python flushed at exit) and the cause is the exit status followed by the last line that carries words, which for a Python traceback is the exception. And `n_samples` and `n_residues` of the `summary` table were written as floats (`4.0`, `33.0`) as soon as one failed run left a blank next to them, which made pandas promote the column; they are written as integers with the failed run's cells empty.
  - version: '1.4'
    date: '2026-10-29'
    note: >-
      The install check also imports pandas, yaml and huggingface_hub, which the pipe scripts need, beside bioemu2, mdtraj and torch.
  - version: '1.3'
    date: '2026-10-29'
    note: >-
      Documentation only, from the first cluster runs. A `seed` reproduces the conformers of a run exactly (identical PDBs on repeat), but only for the same `batch_size`: the first batch is the same at 16 and at 2 and the later ones are not, so the docs no longer present `batch_size` as a memory knob alone. The structures section says how a ligand is written: the next chain letter, ATOM records, the CCD code as residue name (`LIG` for a SMILES) and atom names bioemu2 assigns, and that the physicality check does not cover it (PoseBusters failed three of four ATP conformers).
  - version: '1.2'
    date: '2026-10-29'
    note: >-
      Every apo run of one protein chain failed on its first cluster run with `TypeError: not all arguments converted during string formatting`, so no structure was ever written: sampling, the trajectory and the physicality report were complete, and the failure came in the split into per-conformer PDBs. mdtraj gives an atom read from a CIF a text serial (`'1'`), and its PDB writer uses the serial, and only integers, whenever the system has fewer than two chains. A system with a ligand or a second protein chain was unaffected, because the writer then numbers the atoms itself. The atoms are numbered from their index before the PDBs are written.
  - version: '1.1'
    date: '2026-10-28'
    note: >-
      Standardized to the framework conventions. The install built Python 3.11, where pip finds no bioemu2 (0.1.0rc0 is the only release, a pre-release, and requires Python 3.12): the env is now Python 3.12 with the requirements in `bioemu2.pip.txt` (`bioemu2[cuda]>=0.1.0rc0`, which admits the release candidate for that package alone), an env left by the old spec is rebuilt, the `bioemu2-preview` checkpoint is fetched into the Hugging Face cache at install, and the verification checks the Python version, the imports and the CLI. Runs follow the Each/Bundle combinatorics of Boltz2 and Protenix, so `Bundle(ligands)` puts several ligands in one system and the ids are the predicted ones. Ligands follow the Ligand Contract: a CCD code is passed as `ccd_code`, otherwise SMILES, and a compounds row with neither fails its run instead of silently sampling the apo protein. The system YAML is written with a YAML writer (a SMILES with a backslash broke the hand-built text). `covalent_linkage` is written as upstream's `bonds` entry, not as a `covalent_linkage` key upstream does not have. The physicality modes are upstream's (`high_quality`, `high_quality_per_residue`, `no_violations`, `no_filter`; `medium_quality` and `low_quality` never existed), and the physicality table is the per-conformer `status` and `reason` upstream reports, with ids that join to `structures`. A supplied alignment is written with the checksum upstream validates (the old one made bioemu2 reject the entry) into a cache directory of the step through `BIOEMU2_MSA_CACHE`, is checked against the sequence, and the parameter is renamed `msas` (`precomputed_msa` stays as an alias). Failures go to `local_missing.csv` and the wrapper merges them with the upstream manifests through the propagation step; the summary has a row for every run, empty where it failed; the step exits non-zero when nothing was attempted or every run failed. Parameters travel in `configuration/config.yaml`; the bioemu2 CLI takes the container prefix instead of warning that containers are unsupported. Summary provenance columns are `sequences.id` and `ligands.id` (were `sequence.id`, `ligand.id`).
  - version: '1.0'
    date: '2026-10-24'
    note: >-
      Initial release. Wraps microsoft/bioemu2, the ligand-capable successor
      of bioemu v1. Each run is one (sequence, ligand set) system YAML; apo
      runs omit the ligand entity. Forwards contact and covalent-linkage
      constraints verbatim into the bioemu2 YAML. Supports a precomputed MSA
      (a3m file or Boltz2 MSA CSV) by pre-populating bioemu2's own
      sequence-hash cache under `~/.cache/bioemu2`, skipping the ColabFold
      cold-start per new sequence.

