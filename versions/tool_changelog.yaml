Load:
  files:
  - biopipelines/load.py
  current: "1.4"
  history:
  - version: '1.4'
    date: '2026-09-11'
    note: >-
      Map-table file column renamed to the canonical `file`: refuses a map_table whose file column is a retired per-tool spelling instead of recovering a stream with no files from it.
  - version: '1.3'
    date: '2026-09-04'
    note: >-
      Matching ids to filenames now inverts the declared `<id>` file template instead of guessing from the basename. Wave 3 made exact basenames claim first, which covers `<id>.pdb` only; the three shipped suffixed templates (`<id>_best.pdb`, `<id>_A3D.csv`, `<id>_RMSF.csv`) never produce a basename equal to an id, so every id still fell through to substring matching -- measured, `design_1` was handed `design_10_best.pdb` while `design_1_best.pdb` went unused, and ids came back renamed to `design_1_A3D`. New `id_patterns.id_from_file_pattern` and `glob_from_file_pattern` provide the inverse and the candidate glob. A one-id templated stream also stopped taking the "already matched" shortcut, which reported it recovered without checking disk.
  - version: '1.2'
    date: '2026-09-02'
    note: >-
      Load recovers a partially-completed output folder instead of failing or answering wrongly. A declared-but-absent `missing.csv` — what a step killed mid-write leaves behind — raised `FileNotFoundError` and denied the user every id that step did produce; it is now reported and excuses nothing. Without a map_table the glob fallback matched `design_10` to `design_1.pdb` by substring and reported `design_1` twice, so exact basenames now claim first and one file serves one id. A readable map_table with zero rows is an answer, not an unresolved template. New `recovery` / `recovery_summary()` / `recovered_nothing` state what was recovered and what was not, and the step's `_COMPLETED`/`_FAILED` marker is read and surfaced. Also sets the derived job name via `name`, the key BaseConfig actually reads; it was passed as `job_name`, which was parked in `.params` and discarded, so every Load ran with an unnamed job.
  - version: '1.1'
    date: '2026-08-31'
    note: >-
      Reads a map_table with dtype=str and keep_default_na=False. Since the map became authoritative for stream ids, type inference renamed them -- a zero-padded 0001 loaded as 1 while its file stayed 0001.pdb, so every downstream join on id silently missed -- and it blanked real NA/nan strings. The rebasing path wrote that damage to disk. Path rebasing now matches whole path components, so a row pointing at a sibling run (Job_001_retry when Job_001 moved) is left alone, and it raises instead of silently keeping the old map when the rebased copy cannot be written.

MMseqs2:
  files:
  - biopipelines/mmseqs2.py
  - pipe_scripts/pipe_mmseqs2_sequences.py
  - pipe_scripts/mmseqs2_client.sh
  current: "1.6"
  history:
  - version: '1.6'
    date: '2026-09-11'
    note: >-
      Map-table file column renamed to the canonical `file`: its `msas` map_table declares one file column, the canonical `file`; it previously declared both `msa_file` and `file` and wrote only the former.
  - version: '1.5'
    date: '2026-09-02'
    note: >-
      No behavioural change; the version moves because the shared `mmseqs2.py` did. See the MMseqs2Server entry.
  - version: '1.4'
    date: '2026-08-31'
    note: >-
      submission_in_progress judges staleness from the lockdir, the same artifact acquire_submit_lock uses. Reading the marker's mtime instead left one state nobody could act on -- marker gone, lockdir present -- where every client saw no submission in progress, failed to acquire because the directory existed, and submitted nothing for the full 3h TTL.
  - version: '1.3'
    date: '2026-08-31'
    note: >-
      Behaves as a guest on the public ColabFold MSA server: sends a User-Agent identifying the lab, reads the submit response's status so a RATELIMIT or MAINTENANCE reply (both of which carry a ticket id) stops the run instead of polling a ticket that was never queued, and backs off with jitter rather than at a fixed 5s. A batch in which every sequence fails now exits non-zero; it previously wrote an empty MSA table at exit 0, which passed the completion check and let every downstream fold run single-sequence with nothing saying so.
  - version: '1.2'
    date: '2026-08-31'
    note: >-
      Corrects the 1.1 note, which describes behaviour this release removed. Alignments are paired by the query header inside each returned chunk, not by an integer alias parsed from the tar member name, and server_url no longer requires output_format="a3m" -- the step always declares and emits .csv, converting a3m on arrival, so output_format now selects only the wire format requested from the search. No behavioural change in this bump.
  - version: '1.1'
    date: '2026-07-27'
    note: Map remote-server alignments to queries by parsed integer alias, not by
      position in the lexically sorted tar members (past ten sequences "10" sorts
      before "2"); require output_format="a3m" with server_url.

MMseqs2Server:
  files:
  - biopipelines/mmseqs2.py
  - pipe_scripts/mmseqs2_server_gpu.sh
  current: "1.5"
  history:
  - version: '1.5'
    date: '2026-09-11'
    note: >-
      Map-table file column renamed to the canonical `file`: same `msas` schema correction as MMseqs2, whose wrapper file it shares.
  - version: '1.4'
    date: '2026-09-02'
    note: >-
      Arms the cleanup trap before claiming the submission lock. The trap was registered after the ~271 s index load because `cleanup()` was defined below it, so a server dying in that window left its lockdir for the full 3 h TTL and suppressed every client's server — the 'died before ready' case cleanup's own comment claimed to handle. Deleting a peer's advertisement is now gated on the server having gone ready, which the earlier trap would otherwise have caused, and cleanup propagates the real exit code instead of a hardcoded 0, which would have turned every pre-ready failure into a reported success.
  - version: '1.3'
    date: '2026-08-31'
    note: >-
      No behavioural change; the version moves because the shared mmseqs2.py did. See the MMseqs2 entry.
  - version: '1.2'
    date: '2026-08-31'
    note: >-
      No behavioural change; the version moves because the shared mmseqs2.py did. Also registered in config.daint.yaml's environment block, which had omitted it and MMseqs2 despite documenting the CPU server on Daint in detail -- both worked there only via the implicit biopipelines fallback.
  - version: '1.1'
    date: '2026-08-31'
    note: >-
      Both server scripts release the submission lock however they exit. The GPU script trapped cleanup on SIGINT/SIGTERM but not EXIT, so under set -e a server dying during install or index load leaked the lock for its full 3h TTL. Both also removed the marker file before the lockdir, and a failed rmdir then left clients seeing no submission in progress and no acquirable lock -- every one of them logging that another client was submitting, and submitting nothing, until the TTL expired. The lockdir is now released first, so a failed rmdir leaves a marker that makes clients wait rather than no-op.

Mock:
  files:
  - biopipelines/mock.py
  - pipe_scripts/pipe_mock.py
  current: "1.5"
  history:
  - version: '1.5'
    date: '2026-09-04'
    note: >-
      A lazy bracket that means a number now says `<#>` instead of `<N>`. Inside a bracket the token was already behaving as a wildcard -- the content is discarded, since a value unknown at configuration time cannot be narrowed there -- while outside a bracket `<N>` is the one-element set containing the letter N. Writing `<N>` for a number was therefore a lie that only happened to work. No behavioural change: the compiled regex is identical.
  - version: '1.4'
    date: '2026-09-04'
    note: >-
      The static pattern agrees too. Recording only a per-axis mode was too coarse for `Bundle(Each(a), b)`, where the `Each` iterates while the bare sources ride along on every row: `get_mode` reports the outer wrapper as a bundle and hides the inner `Each`, so predict gave ['a1+b1', 'a2+b1'] while produce gave ['a1+a2+b1']. The axis metadata now records which streams iterate, which are static and which side of the id the static part lands on, and streams are identified by index rather than name because two in one axis may share one. All six axis shapes -- bare, Each, pure Bundle, both static orderings, and multi-axis -- now agree.
  - version: '1.3'
    date: '2026-09-04'
    note: >-
      Provenance is recorded while ids are composed instead of recovered by splitting them. `_rebuild_runtime_provenance` split the parent id on `+` and gave part i to axis i, but a bundled axis contributes several `+`-joined parts and the composer hoists it ahead of the iterated axes, so with Bundle(compounds) and Each(structures) the structures column was assigned a ligand id and the rest shifted behind it -- silently, into the column downstream joins on. Each axis's contribution is now kept from composition, matching the config-time declaration exactly including the per-member `<axis>.<n>` bundle columns. The positional path remains only as the fallback for a config written before axis metadata existed.
  - version: '1.2'
    date: '2026-09-04'
    note: >-
      Mock produces the ids it declares. `_collect_datastreams` flattened Bundle/Each away, so the config JSON carried no per-axis mode and the runtime composed ids with its own cartesian product over every axis: a bundled axis iterated instead of contributing one prefix, giving four outputs against two declared and a FAILED marker. The config now records each axis's mode and streams, and `pipe_mock.py` calls the framework's `predict_single_output_id` rather than its own loop. Configs written before this keep working, treating one stream as one iterated axis.
  - version: '1.1'
    date: '2026-09-02'
    note: >-
      Declares `USER_STREAM_NAMES = True`. Mock's stream names come from the user's `streams={...}` dict, so the framework's stream-name registry check cannot know them in advance and would report a documented feature. The format checks still apply. One declarative line; no change to generated scripts or outputs.

