Boltz2:
  files:
  - biopipelines/boltz2.py
  - pipe_scripts/pipe_boltz_config_unified.py
  - pipe_scripts/pipe_boltz_direct_sequence_config.py
  - pipe_scripts/pipe_boltz_msa_copy.py
  - pipe_scripts/pipe_boltz_postprocessing.py
  - pipe_scripts/pipe_boltz_results.py
  - biopipelines/nucleic_acids.py
  - pipe_scripts/pipe_axis_data.py
  current: "2.9"
  history:
  - version: '2.9'
    date: '2026-09-22'
    note: >-
      The axis reader and the nucleic-acid helpers move to pipe_scripts/pipe_axis_data.py and
      biopipelines/nucleic_acids.py, so Boltz2 and OpenFold3 read an axis's rows and expand a
      double-stranded sequence through one implementation. No behaviour change; the code that
      ran is the code that moved.
  - version: '2.8'
    date: '2026-09-22'
    note: >-
      Memory controls, so a complex too large for the GPU can be folded at all: max_msa_seqs,
      subsample_msa/num_subsampled_msa, max_parallel_samples and no_kernels, plus sampling_steps
      and step_scale. boltz reads --num_subsampled_msa only when --subsample_msa is set, so the
      count alone is refused rather than left to run at full MSA depth and die on the OOM it was
      configured to avoid. Every setting is echoed into the step config and recorded in the tool
      output, since a memory setting changes the result.
  - version: '2.7'
    date: '2026-09-22'
    note: >-
      pipe_boltz_config_unified.py puts the repo root on sys.path, not only the package directory.
      It imports bare module names (combinatorics, id_patterns) which resolve against the package
      dir, and also `from biopipelines.id_map_utils import get_mapped_ids`, which needs the repo
      root; only the first path was added. In Boltz2Env, where biopipelines is not installed, the
      config generator therefore died with ModuleNotFoundError, wrote zero YAML configs, and boltz
      then ran to completion over zero inputs - so the step produced no structures while reporting
      no error of its own.
  - version: '2.6'
    date: '2026-09-21'
    note: >-
      Consumes a `Grouped` axis: a source tagged with a group stream has its rows collapsed into one iteration element per group, and its members become consecutive chain entries off the shared chain-id counter. Before this, the only way to place several chains in one prediction was `Bundle`, which cannot express a partition - so a multi-chain inverse-folding design had no correct spelling at all. Group membership is resolved on the compute node by the framework's id matching, so the group ids are all that has to be known at configuration time.
  - version: '2.5'
    date: '2026-09-20'
    note: >-
      Two changes developed in parallel on separate branches, both numbered 2.5 and merged into
      this single entry rather than renumbered, so no already-recorded version string changes
      meaning. (1) Ligands-only prediction: a Boltz2 job may be built from a compounds stream with
      no protein, for folding or scoring ligands on their own. (2) pipe_boltz_msa_copy.py takes an
      optional --queries-csv and, when given, copies only the MSAs whose destination id appears in
      it; Boltz2 does not pass the flag, so its own behavior is unchanged and the argument exists
      for AlphaFold 1.4.
  - version: '2.4'
    date: '2026-09-11'
    note: >-
      Map-table file column renamed to the canonical `file`: its `msas` map_table records the alignment path under `file`, not `msa_file`; the MSA copy and config steps read the canonical name.
  - version: '2.3'
    date: '2026-09-04'
    note: >-
      Forwards unrecognized constructor kwargs onto `boltz predict`.
  - version: '2.2'
    date: '2026-09-04'
    note: >-
      Post-processing stops parsing ids itself. `_prov_index` re-implemented the parent-suffix rule with `rpartition('_')` and an `isdigit()` guard to relate a per-sample structure id to the '<base>' key combinatorics uses for provenance; the shared `get_mapped_ids` ladder already answers that as its parent tier, so the local copy is gone and all three provenance sites call it. The lookup is now batched once per table instead of once per row per stream, a non-digit suffix resolves as a child rather than silently losing its provenance columns, and a mixed-tier lookup is reported by the id_match_consistency check, which the local copy could never do.
  - version: '2.1'
    date: '2026-09-02'
    note: >-
      Documentation only: `Ligand(code=...)` in docstrings and user-facing error messages becomes `Ligand(codes=...)`, since the two parameters were unified and `code` is now a synonym that will soon be deprecated. No behavioural change; the version moves because the wrapper file did.
  - version: '2.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.
  - version: '1.1'
    date: '2026-07-29'
    note: >-
      pipe_boltz_config_unified.py now declares and honours --single-sequence.
      The wrapper emitted the flag whenever single_sequence=True, but the pipe
      script's parser never declared it, so argparse rejected the invocation,
      no YAML configs were written, and Boltz2 folded ZERO inputs while
      post-processing still reported success. Honouring it sets msa: empty on
      every protein chain, which is Boltz's single-sequence mode.
  - version: '1.2'
    date: '2026-08-05'
    note: >-
      A ligands-only prediction is now accepted. validate_params required config or a polymer axis, so Boltz2(ligands=...) with no protein was rejected even though everything downstream already handled it: pipe_boltz_config_unified.py emits a correct single-chain ligand config and the postprocessing maps the ids back without a sequences file. The alternative entry point does not work either -- config=<yaml> is still accepted by the constructor, but get_output_files calls predict_output_ids_with_provenance, which raises "requires at least one named input" when no axis exists -- so the ligands axis is the only route to a ligand-only run. affinity now raises when there is no receptor to bind rather than emitting a meaningless binder property. Verified on Daint (job 4327496): 8 dyes predicted, PDB atom names matching Boltz2.predict_atom_names exactly; protein-only, protein+ligand and empty Boltz2() behave as before.
BoltzGen:
  files:
  - biopipelines/boltzgen.py
  - pipe_scripts/pipe_boltzgen.py
  - pipe_scripts/pipe_boltzgen_config.py
  current: "2.5"
  history:
  - version: '2.5'
    date: '2026-09-23'
    note: >-
      A missing patch binary is reported as such instead of as a boltzgen version mismatch; the install still fails, since the local patches can then be neither applied nor confirmed.
  - version: '2.4'
    date: '2026-09-23'
    note: >-
      The local 0.3.1 patches are applied by install() instead of only being recorded: every install path, the already-installed shortcut included, applies them or confirms they are in place, and fails if they apply to neither state. boltzgen is pinned to 0.3.1, the version the patch targets, so a rebuild no longer resolves a release that silently lacks them. smiles_overrides keys must be 1-5 uppercase letters or digits (they become an env-var name and are matched against the CIF res_name verbatim, so a lowercase code never matched), and each SMILES is shell-quoted in the export, where a quote or $ used to break or inject into the job script.
  - version: '2.3'
    date: '2026-09-19'
    note: >-
      `smiles_overrides={"LIG": "..."}` exports `BOLTZGEN_SMILES_<code>` into the job script, so a
      ligand carried through the pipeline by CCD code can be folded from an explicit SMILES without
      editing the compounds table. The local 0.3.1 patches are also recorded in the repo: they lived
      only in site-packages on the cluster, so `bp-warm BoltzGen` or an environment rebuild silently
      discarded them and BoltzGen then behaved differently with no indication why.
  - version: '2.2'
    date: '2026-09-18'
    note: >-
      smiles_overrides={CODE: SMILES} exports BOLTZGEN_SMILES_<code> into the generated job script, so a ligand carried through the pipeline by CCD code can be designed against an explicit SMILES without editing the compounds table. Default {} leaves the emitted script byte-identical.
  - version: '2.1'
    date: '2026-09-04'
    note: >-
      No behavioural change. BoltzGen and BoltzGenImport share `biopipelines/boltzgen.py`, and the version moves because the file did when the import step stopped comparing an id_map pattern against a single literal spelling.
