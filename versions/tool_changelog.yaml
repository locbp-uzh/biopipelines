  - pipe_scripts/pipe_hbdesigner_constraints.py
  current: "2.1"
  history:
  - version: '2.1'
    date: '2026-09-04'
    note: >-
      The per-input `run_hbdesigner` command is emitted as a bash array instead of through `eval`. `eval` re-parsed the assembled line, so `$OUT_DIR` -- which carries the stream id, and stream ids are validated nowhere -- could close its own quoting and run a second command: an id of `x";>PWNED;"` executed `>PWNED` and silently truncated `--out_dir`. Argument output is byte-identical for every ordinary input.
