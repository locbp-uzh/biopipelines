  - biopipelines/structure_cluster.py
  - pipe_scripts/pipe_structure_cluster.py
  current: "1.1"
  history:
  - version: '1.1'
    date: '2026-07-29'
    note: >-
      Adds the cluster MEDOID alongside the representative. The representative
      is the best-scoring member (sphere exclusion visits in ranking order) and
      can sit at the edge of its own cluster; the medoid maximises mean
      similarity to the other members and is the family's most typical fold.
      New `medoid` column on `clusters` and `is_medoid` on `assignments`; a
      singleton is its own medoid. Measured on a 48-design campaign, 3 of 14
      families had a medoid different from the representative.
  - version: '1.0'
    date: '2026-07-28'
    note: >-
      New tool. Fold-similarity clustering of a structures stream by sphere
      exclusion over distance-matrix RMSD of length-normalised C-alpha traces,
      with per-cluster ranking on user-supplied metric columns.

