DNAEncoder:
  files:
  - biopipelines/dna_encoder.py
  - pipe_scripts/pipe_dna_encoder.py
  current: "1.2"
  history:
  - version: '1.2'
    date: '2026-08-31'
    note: >-
      Treats a degenerate base as able to complete a forbidden site. _matches tested whether the generated base was literally in the site's IUPAC set, so the NNN emitted for an X residue matched nothing and was judged incapable of creating a site -- the optimistic reading of an unknown base. Both sides are now compared as sets, so a window that COULD be the site once synthesised is rejected.
  - version: '1.1'
    date: '2026-08-31'
    note: >-
      Adds exclude_sites: recognition sequences to keep out of the coding DNA, matched in both orientations and written in IUPAC. Codons are redrawn from the same frequency-thresholded pool, so exclusion does not push the sequence toward rare codons, and a site straddling a codon boundary is caught by checking a window around each placed codon. One un-encodable sequence now costs its own row instead of aborting the batch.

