RCSB:
  files:
  - biopipelines/rcsb.py
  - pipe_scripts/pipe_rcsb_search.py
  current: "1.5"
  history:
  - version: '1.5'
    date: '2026-09-11'
    note: >-
      Map-table file column renamed to the canonical `file`: its `structures` map_table records the per-id file under `file`, not `file_path`; the upstream-map read follows.
  - version: '1.4'
    date: '2026-09-07'
    note: >-
      The lazy whole-id pattern for a compounds-driven search is spelled `[<?>]` rather than `[<hits>]`. A slot inside a bracket is a literal value set now, like everywhere else, so a bare word no longer falls through to the segment wildcard -- `[<hits>]` would have matched only the literal text `hits`. `[<?>]` compiles to the same regex the old spelling did, so selection is unchanged.
