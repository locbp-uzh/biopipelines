Gnina:
  files:
  - biopipelines/gnina.py
  - pipe_scripts/pipe_gnina.py
  - pipe_scripts/pipe_vina_backend.py
  current: "2.3"
  history:
  - version: '2.3'
    date: '2026-10-30'
    note: >-
      Every id is built by the shared axis composition instead of joining with `_`. A pair is `<protein>+<ligand>` as Boltz2 names its complexes, a `docking_summary` row appends `_conf<k>`, and a `docking_results` row appends `_r<run>_p<pose>`. Two pairs whose ids joined to the same string (`a_b`+`c` and `a`+`b_c`) shared one docking scratch SDF and one `<id>_best.pdb`, and two conformers of a pair shared the summary id and the best file, so the last conformer written won; a pose id did not carry its conformer, so two conformers repeated it. The pair's file is now the best conformer's pose (lowest `pseudo_binding_energy`, else lowest `best_vina`), and each other conformer keeps its own under `execution/conformer_poses/`. Score and minimize ids are unchanged: the complex's own id. The Vina branch of score and minimize raised NameError on `config`, so every complex became a `failure` row; forwarded kwargs now reach vina.
  - version: '2.2'
    date: '2026-09-11'
    note: >-
      a zero-length `autobox_ligand` stream is accepted instead of raising "must be DataStream ... got DataStream". The type check and the type error hung off a length test, so an upstream filtered to nothing failed as a type error naming the type it had.
  - version: '2.1'
    date: '2026-09-04'
    note: >-
      Forwards unrecognized constructor kwargs to the `gnina` binary. Gnina builds its argv in the pipe script rather than in the wrapper's bash, so the tokens travel in the config JSON as a list and the pipe script appends them to the command it hands to subprocess.run -- no shell, so nothing re-parses them.
  - version: '2.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.
  - version: '1.8'
    date: '2026-08-31'
    note: >-
      tool_overrides.gnina no longer applies to the Vina backend. The block configures CUDA modules and LD_LIBRARY_PATH for the GPU binary; Vina is CPU-only conda-forge software in its own env, so loading GNINA's CUDA stack into its step is noise at best and a library conflict at worst. A Vina pose whose bond orders could not be restored from the input template is tagged bond_orders_restored=false rather than written out as an all-single-bond skeleton indistinguishable from a good one.
  - version: '1.7'
    date: '2026-08-31'
    note: >-
      Resolves every receptor's autobox reference in one provenance-aware pass instead of one get_mapped_ids call per protein with no map_table. Without the map_table an upstream rename has no string relation to match on (Panda_1 vs design_3), so the lookup found nothing and every receptor silently fell back to its own crystal HETATM. Extracted as resolve_autobox_references so the behaviour is testable.
  - version: '1.6'
    date: '2026-08-31'
    note: >-
      A receptor whose PDBQT conversion fails is recorded in missing.csv instead of disappearing from every output table: docking mode previously wrote that manifest from upstream rows alone. Stops defaulting backend and scoring when reading the config, since the wrapper always writes both -- a malformed config now crashes rather than silently docking with GNINA.
  - version: '1.5'
    date: '2026-08-31'
    note: >-
      No change to Gnina's own behaviour; the version moves because the shared pipe_vina_backend.py did. See the Vina entry.
  - version: '1.4'
    date: '2026-08-31'
    note: >-
      No change to Gnina's own behaviour; the version moves because the shared pipe_vina_backend.py did. See the Vina entry.
  - version: '1.3'
    date: '2026-08-31'
    note: >-
      No change to Gnina's own behaviour. _validate_vina_backend, a Gnina-class method the Vina subclass calls, no longer compares the CNN parameters against hard-coded copies of Gnina's defaults; the version moves because the shared wrapper file did.
  - version: '1.2'
    date: '2026-07-28'
    note: >-
      New backend="gnina"|"vina" parameter selecting the docking engine, plus a scoring parameter for Vina's force field. Under backend="vina" the CNN parameters are rejected and the cnn_* columns are absent from the output tables.
  - version: '1.1'
    date: '2026-06-30'
    note: >-
      Emits a warning when a container image is configured: this tool runs its model in-process (or dispatches host-env sub-processes) and does not support container execution; it runs in environment mode.

