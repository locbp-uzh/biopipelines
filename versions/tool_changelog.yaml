    date: '2026-09-11'
    note: >-
      same `autobox_ligand` correction as Gnina, whose wrapper file it shares.
  - version: '2.1'
    date: '2026-09-04'
    note: >-
      Forwards unrecognized constructor kwargs to the `vina` binary, by the same config-JSON route as Gnina, whose pipe script drives it.
  - version: '2.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.
  - version: '1.6'
    date: '2026-08-31'
    note: >-
      See the Gnina entry: the CUDA overrides no longer reach this backend, and an unrestored pose is tagged rather than silently emitted with PDBQT's single-bond perception.
  - version: '1.5'
    date: '2026-08-31'
    note: >-
      No behavioural change; the version moves because the shared pipe_gnina.py did. See the Gnina entry.
  - version: '1.4'
    date: '2026-08-31'
    note: >-
      Honours autobox_add in score and minimize mode. The value was read from the config and never passed, so box_args always used its own 4.0 default and the user's setting was silently discarded.
  - version: '1.3'
    date: '2026-08-31'
    note: >-
      Refuses to dock in a box that does not reach the receptor. With no explicit box and no crystal ligand, box_args falls back to the INPUT ligand's coordinates -- nothing has been docked at that point. That is correct when the ligand was carved from this receptor, where its coordinates are the crystal pose, and meaningless when RDKit embedded it from SMILES, since such a conformer is centred on the origin while the receptor sits wherever its crystallographers left it. The run now raises with both extents named instead of returning scores for empty space.
  - version: '1.2'
    date: '2026-08-31'
    note: >-
      Warns when it boxes on the docked ligand's own coordinates. With no explicit box and no crystal ligand in the receptor, box_args falls back to the ligand being docked; that is only meaningful if the ligand was carved from this receptor, since a conformer generated from SMILES sits in an arbitrary frame and the box then lands away from the protein. The GNINA branch warns in the same situation and this one was silent, so the result was a plausible score for a pocket Vina never searched.
  - version: '1.1'
    date: '2026-08-31'
    note: >-
      Reads Gnina's CNN parameter defaults from its signature instead of hard-coded copies. 85d3134 moved cnn_score_threshold's default to 0.0 while the check still compared against 0.5, so the inherited value read as an offender and every Vina(...) raised at construction; the tool could not be used at all.
  - version: '1.0'
    date: '2026-07-28'
    note: >-
      AutoDock Vina docking: Gnina with backend="vina" locked, its own env and install. CPU-only, no CNN scoring. The docking route on aarch64, where GNINA's prebuilt x86-64 binary cannot run.

