ProteinMPNN:
  files:
  - biopipelines/protein_mpnn.py
  - biopipelines/chain_rows.py
  - pipe_scripts/pipe_pmpnn_fixed_positions.py
  - pipe_scripts/pipe_pmpnn_table.py
  - pipe_scripts/pipe_fa_to_csv_fasta.py
  current: "2.9"
  history:
  - version: '2.9'
    date: '2026-09-23'
    note: >-
      No behavioural change: removes accepts_multiple from the shared biopipelines/chain_rows.py, which lost its last caller in the previous version.
  - version: '2.8'
    date: '2026-09-23'
    note: >-
      Naming several chains (chains=["A","B"]) no longer attaches an unqualified fixed=/redesigned= selection to the first of them. positions_chain returned chains[0] for any non-empty list, so the runtime skipped its ambiguity check and fixed the residues on chain A silently; several named chains now resolve as "auto", where a chainless selection on a multi-chain structure raises naming the chains, as 2.6 documented. The unused MULTICHAIN key is gone from the positions config.
  - version: '2.7'
    date: '2026-09-23'
    note: >-
      The chain= deprecation line no longer claims the pipeline runs as written: chain= used to name the chain an unqualified selection belongs to and left every other chain fused in one sequence row, while chains= also decides which chains become rows, so chain="B" now emits chain B alone. Separately, equal-length chains are assigned by sequence identity to the input chains: both candidate orders matched by length and alphabetical always won, so a design written in appearance order (B before A) had its two sequences swapped under each other's chain letters. A tie that sequence cannot break is reported rather than resolved silently.
  - version: '2.6'
    date: '2026-09-21'
    note: >-
      Chain-qualified position selections finally route per chain. `sele_utils.sele_to_list` is chain-aware and both MPNN scripts import it, but this one aliased it away and defined a local `sele_to_list` of the same name that dropped the chain -- so a selection reading "A3-5+B2" had its residues merged into one flat set and applied to a single chain, while LigandMPNN handled the identical string correctly. Measured against the pre-change script, "A3-5+B2" on a two-chain backbone fixed A at 1+6-10 and fixed all of B, silently ignoring B2 and freeing A2; it now fixes A at 1-2+6-10 and B at 1+3-4. Selections are bucketed by the chain each residue names, falling back to the dict key it was written under and then to the chain resolved from the structure, so a qualified string needs no dict and the dict is left for attaching a different source per chain. Every single-chain case is byte-identical to before, verified by running both versions over the same inputs.
  - version: '2.5'
    date: '2026-09-21'
    note: >-
      Also collapses `chain` into `chains`: the two were one letter apart and meant different things -- which chains are emitted, versus which chain an unqualified position selection belongs to -- which is the `Ligand` `code`/`codes` mistake again. Naming the chains in play answers both, so there is one parameter; `chain=` binds it through `PARAMETER_ALIASES` and reports a `deprecated_alias` line. A chainless selection on a multi-chain structure now raises naming the chains, where ProteinMPNN attached it to whichever chain came first and LigandMPNN used the literal "A" -- silently wrong whenever the single chain was called anything else, and now read off each structure. `fixed` and `redesigned` accept a `{chain: selection}` dict, each value taking any form the parameter accepts, and the `sele.csv` summary is chain-aware as soon as more than one chain is in play.
  - version: '2.4'
    date: '2026-09-21'
    note: >-
      A design over a multi-chain backbone becomes one `sequences` row per chain instead of one row whose `sequence` fuses every chain behind a separator. ProteinMPNN joins them with `/`, its own native convention. A `sequences` row is one polymer chain, so that value reached every consumer as if it were one: Boltz2 wrote it into a single YAML chain entry, where Boltz mapped the separator to an `UNK` residue and folded a complex containing a chain that should not exist, reporting high confidence for it. The new `chains` parameter says which chains become rows -- `None` (the default) expects a single-chain backbone and records a multi-chain one as a failure in `missing.csv` naming the chains found, `"A"` emits just that chain with the ids it always had, `["A","B"]` emits `<design>_<chain>` ids, and `"all"` emits every chain behind a lazy `[_<?>]` pattern. Chain letters are resolved by matching each segment's length against the backbone's per-chain residue counts, and a design that cannot be reconciled is dropped rather than mislabelled. A new `designs` stream carries one row per design -- the ids the `sequences` stream used to have -- and is what `Grouped` groups the chain rows by to fold a complex. Single-chain pipelines are unaffected: same ids, same rows.
  - version: '2.3'
    date: '2026-09-03'
    note: >-
      The documented `(TableInfo, "column")` column-reference form now binds. Only a `TableReference` was recognised, so a tuple fell through to `json.dump` and raised `TypeError: Object of type TableInfo is not JSON serializable` from `generate_script` — after the whole pipeline had been configured. `fixed` and `redesigned` are normalized through the shared `resolve_table_reference`, which accepts a literal selection, a `TableReference`, a `(TableInfo, column)` tuple or a `(path, column)` pair, and refuses anything else at construction time naming the parameter.
  - version: '2.2'
    date: '2026-09-02'
    note: >-
      Forwards constructor keywords it does not type onto the upstream command line, so an advanced user can reach an option the wrapper never curated. Declares `FORWARD_UNKNOWN_KWARGS` with its upstream CLI dialect — hydra `key=value` for the RFdiffusion family, argparse `--key value` for the MPNN family — and every forwarded key and value is validated at construction time through the same denylist as any other freeform string, then emitted double-quoted and echoed into the step log so a forwarded flag is visible rather than silent. A leftover key within the similarity cutoff of a real parameter name is reported as a probable misspelling naming the candidate, and still forwarded rather than dropped.
  - version: '2.1'
    date: '2026-09-02'
    note: >-
      Declares SE3nv as its environment name rather than mlfold. Every config already mapped ProteinMPNN to SE3nv — deliberately shared with RFdiffusion to spare an environment — and no mlfold spec has ever existed in environments/, so the old literal named a file that could not be found. Upstream's own name is recorded as a comment. Only pip mode reads this attribute and that path was already non-functional, so no working behaviour changes.
  - version: '2.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.
  - version: '1.1'
    date: '2026-06-30'
    note: >-
      Helper arguments moved from positional CLI into a JSON config file passed to the resolver script; generated bash changed, no user-facing parameter change.

