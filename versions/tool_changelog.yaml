  - biopipelines/scripting.py
  current: "1.1"
  history:
  - version: '1.1'
    date: '2026-09-02'
    note: >-
      Declares `USER_STREAM_NAMES = True`. A Scripting `configuration()` returns stream names chosen by the user's script, so the stream-name registry check cannot know them in advance. The format checks still apply. One declarative line; no change to generated scripts or outputs.
