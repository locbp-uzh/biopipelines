  current: "2.4"
  history:
  - version: '2.4'
    date: '2026-09-11'
    note: >-
      Map-table file column renamed to the canonical `file`: its `msas` map_table records the alignment path under `file`, not `msa_file`; the MSA copy and config steps read the canonical name.
  - version: '2.3'
    date: '2026-09-04'
    note: >-
      Forwards unrecognized constructor kwargs onto `boltz predict`.
  - version: '2.2'
    date: '2026-09-04'
    note: >-
      Post-processing stops parsing ids itself. `_prov_index` re-implemented the parent-suffix rule with `rpartition('_')` and an `isdigit()` guard to relate a per-sample structure id to the '<base>' key combinatorics uses for provenance; the shared `get_mapped_ids` ladder already answers that as its parent tier, so the local copy is gone and all three provenance sites call it. The lookup is now batched once per table instead of once per row per stream, a non-digit suffix resolves as a child rather than silently losing its provenance columns, and a mixed-tier lookup is reported by the id_match_consistency check, which the local copy could never do.
  - version: '2.1'
    date: '2026-09-02'
    note: >-
      Documentation only: `Ligand(code=...)` in docstrings and user-facing error messages becomes `Ligand(codes=...)`, since the two parameters were unified and `code` is now a synonym that will soon be deprecated. No behavioural change; the version moves because the wrapper file did.
  - version: '2.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.
  - version: '1.1'
    date: '2026-07-29'
    note: >-
      pipe_boltz_config_unified.py now declares and honours --single-sequence.
      The wrapper emitted the flag whenever single_sequence=True, but the pipe
      script's parser never declared it, so argparse rejected the invocation,
      no YAML configs were written, and Boltz2 folded ZERO inputs while
      post-processing still reported success. Honouring it sets msa: empty on
      every protein chain, which is Boltz's single-sequence mode.

