BFactor:
  files:
  - biopipelines/bfactor.py
  - pipe_scripts/pipe_bfactor.py
  current: "1.2"
  history:
  - version: '1.2'
    date: '2026-09-23'
    note: >-
      The chain check counts only chains that have residues inside the span. 1.1 counted every chain, so a protein with a ligand or waters, the ordinary predictor output, had every unqualified selection recorded as a failure.
  - version: '1.1'
    date: '2026-09-23'
    note: >-
      Selection parsing stops guessing. An unqualified span on a multi-chain structure records that id as a failure naming its chains instead of averaging the same residue numbers across every chain; a part that is not a span is refused (a typo used to become an empty selection reported as n=0), at configuration time for a literal; and insertion-code residues (100, 100A) stay separate, with an icode column in the per-residue table.
  - version: '1.0'
    date: '2026-09-21'
    note: >-
      Initial release. Reads the per-residue B-factor column - where Boltz2 writes pLDDT,
      AlphaFold and ESMFold write it on a 0-100 scale, and an experimental structure carries
      a temperature factor - and summarizes it over any number of named selections, each a
      literal selection string or a table column reference resolved per structure id. Emits a
      resi-csv stream consumable by Selection and Consensus, plus a per-structure summary
      carrying <name>_delta, the selection's mean minus the whole structure's.
