ReMap:
  files:
  - biopipelines/remap.py
  - pipe_scripts/pipe_remap.py
  current: "1.2"
  history:
  - version: '1.2'
    date: '2026-09-04'
    note: >-
      The lazy renumber pattern was a bare slot, not a bracket. `f"{onto}_<N>"` is not lazy at all: `<N>` outside a bracket is the one-element set containing the letter N, so the branch declared the single literal id `onto_N`, count 1, which matched none of the real `onto_1..onto_n` -- the pattern_selection check had been reporting that it covered nothing. It now emits `f"{onto}_[<#>]"`, the same spelling Pool and Panda already use for a flat renumber.
  - version: '1.1'
    date: '2026-09-02'
    note: >-
      A lazy pattern now *selects* the map_table rows it covers via `resolve_pattern_ids` instead of taking every row in the table, which is what the manual's "the map_table is the source of truth, the pattern is the selector" already specified. A lazy `files` entry no longer raises `LazyPatternError`: it is partially expanded and keeps its brackets. The remaining "is this a pattern" guards were switched to `can_expand` / `can_expand_ids`, the question they were already relying on positionally.

