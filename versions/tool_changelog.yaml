ESMFold2:
  files:
  - biopipelines/esmfold2.py
  - pipe_scripts/pipe_esmfold2_inference.py
  - pipe_scripts/pipe_esmfold2_postprocessing.py
  - pipe_scripts/pipe_axis_data.py
  current: "2.4"
  history:
  - version: '2.4'
    date: '2026-09-23'
    note: >-
      Axis source tables are read with string ids, so an id such as 001 is not turned into 1 and then silently dropped by the axis id filter added in 2.3.
  - version: '2.3'
    date: '2026-09-23'
    note: >-
      A Grouped axis is folded as one complex per group. ESMFold2 accepted Grouped at configuration time and declared one output per group, but the inference script had no `group_by` handling, so it folded every chain row on its own and the declared outputs never appeared. The rows now go through the shared `group_records`, and a group's member rows become consecutive chains. The axis `ids` filter a narrowed stream carries is also honoured, which the reader ignored.
  - version: '2.2'
    date: '2026-09-19'
    note: >-
      Frees CUDA tensors between diffusion samples, and keeps per-chain-pair ipTM as
      `iptm_chain_<a>_<b>` columns. Both were found running a ternary complex at 20 diffusion
      samples; neither is visible at the one to five samples every earlier run used, because the
      retained results only exhaust the device once there are enough of them.
  - version: '2.1'
    date: '2026-09-11'
    note: >-
      Map-table file column renamed to the canonical `file`: reads an upstream `msas` map_table through the canonical `file` column.
  - version: '2.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.
  - version: '1.5'
    date: '2026-08-31'
    note: >-
      No behavioural change. The eight-line comment above the missing-table propagation call was collapsed to one line during branch integration, per the repository's rule that a comment states the non-obvious why in a single line; the rationale it carried lives in the 1.3 entry above and in the commit history. The version moves only because the wrapper file did.
  - version: '1.0'
    date: '2026-07-05'
    note: >-
      Initial ESMFold2 wrapper: all-atom biomolecular complex prediction (EvolutionaryScale, github.com/evolutionaryscale/esm). Folds proteins / ssDNA / dsDNA / ssRNA / dsRNA / ligands with Bundle/Each combinatorics, per-protein-chain a3m MSA recycling, and inference-time scaling (num_loops / num_diffusion_samples / num_seeds, best-of-N by ipTM/pLDDT). Emits an mmCIF structures stream and a confidence table (plddt, ptm, iptm, optional max_pae). Cluster and Colab share one code path; Colab-verified on A100 across the full usage matrix.
  - version: '1.2'
    date: '2026-07-29'
    note: >-
      Exposes the two StructurePredictionInput constraints the wrapper was dropping: modifications (per-residue CCD substitution on a polymer chain, so SEP/TPO/PTR fold as real phospho-residues rather than their unmodified parents) and covalent_bonds (CovalentBond between entities). Both are addressed by chain id and 1-indexed residue position, matching the rest of the framework, and are written to _configuration/constraints_config.json for the inference script to convert. Covalent bonds are given as atom NAMES, matching Boltz2's bond-constraint interfaces; the inference script resolves each name to the index upstream indexes by, which requires enumerating atoms with the bonds already declared (leaving atoms are stripped only then) and therefore runs as a patch-up pass over placeholder indices. Resolving against the unmodified residue instead would be silently wrong: OG is atom 3 of SEP but atom 5 of SER, and atom 5 of SEP is the backbone O. Upstream silently drops a covalent bond whose chain or atom index does not resolve — every such failure now raises. No pocket parameter: upstream defines PocketConditioning and round-trips it through StructurePredictionInput, but build_feature_tensors zeroes pocket_feature unconditionally and never reads input.pocket (esm 3.3.0), so it would be accepted and discarded; measured on a GH200, pocket_feature is all-zero and identical with and without it. A pocket= kwarg raises rather than being swallowed by BaseConfig. Verified against esm 3.3.0 on Daint: SEP yields P/O1P/O2P/O3P where the SER control has no phosphorus, and a declared covalent bond takes token_bonds from 88 to 90 edges. Version 1.1 is skipped: it is claimed by an unrelated in-flight missing-table fix on another branch.

  - version: '1.3'
    date: '2026-07-29'
    note: >-
      generate_script now emits the missing-table propagation step it already declared. get_output_files() adds the `missing` table as soon as any input carries an upstream missing manifest, but the matching _generate_missing_table_propagation() call was absent, so tables/missing.csv was never written and the completion check stamped _FAILED on every ESMFold2 step whose structures, compounds and confidence outputs were all correct -- silently, in any pipeline with a filterable upstream. The emit is guarded by the same condition as the declaration so the two cannot drift apart. Developed as 1.1 before 1.2 merged; it lands as 1.3.
  - version: '1.4'
    date: '2026-08-05'
    note: >-
      Adds glycans=[[CCD, ...]], one ligand chain per glycan given as an ordered list of CCD codes, carried on the constraints payload rather than the compounds axis (glycans are not combinatorial, and Ligand caps a CCD code at 5 characters so it cannot express a multi-residue chain). Upstream bonds none of the residues, so the glycosidic linkages and the protein attachment must still be declared through covalent_bonds -- which is also what makes upstream strip the anomeric O1, so an undeclared linkage is chemically wrong rather than merely unbonded. Chain ids are now assigned by entity type (polymers first, ligands last) instead of in call order, which followed whether an axis iterated rather than what it held: ESMFold2(proteins=Bundle(a, b), ligands=lig) gave the ligand chain A and moved the protein letters whenever a ligand was added or removed, silently repointing any covalent_bonds/modifications constraint written against them. The ligand branch now gates on the compounds table's format column before trusting a CCD code, so a SMILES compound is no longer folded as CCD entry LIG (a real entry, C15H11N3) with confidence, ipTM and PAE reported for the wrong molecule.
