    date: '2026-08-31'
    note: >-
      Honours autobox_add in score and minimize mode. The value was read from the config and never passed, so box_args always used its own 4.0 default and the user's setting was silently discarded.
  - version: '1.3'
    date: '2026-08-31'
    note: >-
      Refuses to dock in a box that does not reach the receptor. With no explicit box and no crystal ligand, box_args falls back to the INPUT ligand's coordinates -- nothing has been docked at that point. That is correct when the ligand was carved from this receptor, where its coordinates are the crystal pose, and meaningless when RDKit embedded it from SMILES, since such a conformer is centred on the origin while the receptor sits wherever its crystallographers left it. The run now raises with both extents named instead of returning scores for empty space.
  - version: '1.2'
    date: '2026-08-31'
    note: >-
      Warns when it boxes on the docked ligand's own coordinates. With no explicit box and no crystal ligand in the receptor, box_args falls back to the ligand being docked; that is only meaningful if the ligand was carved from this receptor, since a conformer generated from SMILES sits in an arbitrary frame and the box then lands away from the protein. The GNINA branch warns in the same situation and this one was silent, so the result was a plausible score for a pocket Vina never searched.
  - version: '1.1'
    date: '2026-08-31'
    note: >-
      Reads Gnina's CNN parameter defaults from its signature instead of hard-coded copies. 85d3134 moved cnn_score_threshold's default to 0.0 while the check still compared against 0.5, so the inherited value read as an offender and every Vina(...) raised at construction; the tool could not be used at all.
  - version: '1.0'
    date: '2026-07-28'
    note: >-
      AutoDock Vina docking: Gnina with backend="vina" locked, its own env and install. CPU-only, no CNN scoring. The docking route on aarch64, where GNINA's prebuilt x86-64 binary cannot run.

LASErMPNN:
  files:
  - biopipelines/lasermpnn.py
  - pipe_scripts/pipe_lasermpnn.py
  - pipe_scripts/pipe_lasermpnn_bfactor.py
  current: "2.2"
  history:
  - version: '2.2'
    date: '2026-09-23'
    note: >-
      Records a change that shipped in 1.5.0 under an unchanged 2.1, so 2.1 names two behaviours; runs from 1.5.0 recording LASErMPNN 2.1 already have it. Copies of design files are size-checked and retried, an empty design file is recorded in missing.csv as "design file empty" instead of being copied, and an empty sequences.csv, structures_map.csv or missing.csv fails the step: a production run lost every byte of a ~3 s window of writes to the shared filesystem with no error raised, and the empty complexes cost 210 downstream Boltz2 jobs. `--collect-only` re-collects the streams from an existing designs tree without rerunning inference.
  - version: '2.1'
    date: '2026-09-04'
    note: >-
      Forwards unrecognized constructor kwargs into the existing free-form `--run-options` channel, each token shlex-quoted so a value containing a space stays one argument through the `shlex.split` on the far side.
  - version: '2.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.
  - version: '1.0'
    date: '2026-07-04'
    note: >-
      Initial LASErMPNN wrapper: ligand-conditioned inverse folding with all-atom sidechain packing (polizzilab/LASErMPNN). Ligand read from input HETATM; fixed/redesigned positions stamped into B-factors and run with --fix_beta; full-atom designed complexes plus a content-bearing sequences stream. Colab-verified on T4.

Ligand:
  files:
  - biopipelines/ligand.py
  - pipe_scripts/pipe_ligand.py
  current: "1.5"
  history:
  - version: '1.5'
    date: '2026-09-23'
    note: >-
      Records a change that shipped in 1.5.0 under an unchanged 1.4, so 1.4 names two behaviours; runs from 1.5.0 recording Ligand 1.4 already have it. SMILES conformers keep the ETKDG geometry when MMFF puckers a ring system the embedder made planar (measured on the SiR silicon-xanthene core: 0.005 A after ETKDG, 1.13 A after MMFF, with MMFFHasAllMoleculeParams true), because GNINA docks rings as rigid and would take the broken shape as given. Drug-like ligands whose rings MMFF keeps flat are unaffected.
  - version: '1.4'
    date: '2026-09-02'
    note: >-
      Documentation only: `Ligand(code=...)` in docstrings and user-facing error messages becomes `Ligand(codes=...)`, since the two parameters were unified and `code` is now a synonym that will soon be deprecated. No behavioural change; the version moves because the wrapper file did.
  - version: '1.3'
    date: '2026-09-02'
    note: >-
      Renames the code-only construction parameter from `code` to `codes`, since the singular was one letter away from it and silently handed back a chemistry-free stub when confused. `code` remains a deprecated alias. Adds `Compound` as another name for this tool, matching the `compounds` stream it emits; outputs keep the original name, so a `Compound(...)` step still writes `001_Ligand/`.
  - version: '1.2'
    date: '2026-08-31'
    note: >-
      Adds template_smiles to the carve path (structures= plus codes=), so a carved ligand's compounds stream carries real chemistry in its smiles column instead of leaving every downstream consumer to perceive bond orders from coordinates. templated_ligand_mol also disables RDKit proximityBonding when the source PDB declares CONECT records, trusting the declared bonds.
  - version: "1.1"
    date: "2026-07-27"
    note: >-
      Add execution-time PubChem PUG-View chemical-vendor enrichment for an
      existing compounds stream, preserving filtered ids and input columns.

LigandAtomSelector:
