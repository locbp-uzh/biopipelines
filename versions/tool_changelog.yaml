    date: '2026-09-04'
    note: >-
      The lazy renumber pattern was a bare slot, not a bracket. `f"{onto}_<N>"` is not lazy at all: `<N>` outside a bracket is the one-element set containing the letter N, so the branch declared the single literal id `onto_N`, count 1, which matched none of the real `onto_1..onto_n` -- the pattern_selection check had been reporting that it covered nothing. It now emits `f"{onto}_[<#>]"`, the same spelling Pool and Panda already use for a flat renumber.
  - version: '1.1'
