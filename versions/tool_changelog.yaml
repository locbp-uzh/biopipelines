Fuse:
  files:
  - biopipelines/fuse.py
  - pipe_scripts/pipe_fuse_queries.py
  current: "1.4"
  history:
  - version: '1.4'
    date: '2026-10-30'
    note: >-
      The id of a fusion, `<slot>+<length>+<slot>...`, is joined by `combinatorics.join_axis_ids` in both the wrapper and the pipe script, which each carried their own copy of the join. No id changes. The docstring that described the ids with `_` now describes the `+` they have always had.
  - version: '1.3'
    date: '2026-09-02'
    note: >-
      Documentation only: `Ligand(code=...)` in docstrings and user-facing error messages becomes `Ligand(codes=...)`, since the two parameters were unified and `code` is now a synonym that will soon be deprecated. No behavioural change; the version moves because the wrapper file did.
  - version: '1.2'
    date: '2026-09-02'
    note: >-
      Renames its `name` parameter to `construct_name`. `name` is framework-reserved as the job name, so the tool captured it and the job name was silently lost; both are now set independently. `name` remains a deprecated alias for the construct label.
  - version: '1.1'
    date: '2026-09-02'
    note: >-
      A lazy slot no longer crashes the query builder. Slot ids were expanded with `expand_ids` behind a `contains_pattern` guard, which answers "is this a pattern" rather than "can this be expanded now", so a lazy `[...]` id passed the guard and raised `LazyPatternError`. Slot ids are now partially expanded and the map_table rows the pattern covers are selected with `select_ids`, making the rows the source of truth for both the sequence lookup and the product axes.

