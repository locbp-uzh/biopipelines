BFactor:
  files:
  - biopipelines/bfactor.py
  - pipe_scripts/pipe_bfactor.py
  current: "1.2"
  history:
  - version: '1.2'
    date: '2026-09-23'
    note: >-
      The chain check counts only chains that have residues inside the span. 1.1 counted every chain, so a protein with a ligand or waters, the ordinary predictor output, had every unqualified selection recorded as a failure.
  - version: '1.1'
    date: '2026-09-23'
    note: >-
      Selection parsing stops guessing. An unqualified span on a multi-chain structure records that id as a failure naming its chains instead of averaging the same residue numbers across every chain; a part that is not a span is refused (a typo used to become an empty selection reported as n=0), at configuration time for a literal; and insertion-code residues (100, 100A) stay separate, with an icode column in the per-residue table.
  - version: '1.0'
    date: '2026-09-21'
    note: >-
      Initial release. Reads the per-residue B-factor column - where Boltz2 writes pLDDT,
      AlphaFold and ESMFold write it on a 0-100 scale, and an experimental structure carries
      a temperature factor - and summarizes it over any number of named selections, each a
      literal selection string or a table column reference resolved per structure id. Emits a
      resi-csv stream consumable by Selection and Consensus, plus a per-structure summary
      carrying <name>_delta, the selection's mean minus the whole structure's.
IPSAE:
  files:
  - biopipelines/ipsae.py
  - pipe_scripts/pipe_ipsae.py
  current: "1.4"
  history:
  - version: '1.4'
    date: '2026-10-29'
    note: >-
      Documentation only. States that ipSAE, `ipsae_d0chn`, `ipsae_d0dom`, `iptm_d0chn` and `lis` come from the PAE matrix and the chain lengths, so moving one chain away leaves them unchanged (0.925 for a ColabFold complex, 0.962 for a Boltz2 one) while `dist1`, `dist2` and the json-only `pdockq` and `pdockq2` fall; and that `pdockq` and `pdockq2` are NaN for an OpenFold3 json because upstream reads pLDDT from `atom_plddts`, not `plddt`.
  - version: '1.3'
    date: '2026-10-29'
    note: >-
      The install check also imports pandas and yaml, which the pipe script needs, beside numpy for upstream's script, and the shortcut runs the import check too; it only tested that ipsae.py existed.
  - version: '1.2'
    date: '2026-10-28'
    note: >-
      A structure with a single chain is reported as one. Upstream prints no chain pair for it, so the id was recorded as `binder_chain 'A' is not a chain of the structure (chains: none)`, which says the binder chain is absent when it is the only chain. The failure now says upstream scored no chain pair because the structure holds fewer than two chains.
  - version: '1.1'
    date: '2026-10-28'
    note: >-
      Accepts structures advertised as `mmcif`. Boltz2(output_format="mmcif") names its stream `mmcif`, which the format check refused although the tool documents mmCIF input (OpenFold3's `cif` was accepted). The file extension, not the format name, selects upstream's reader, so nothing else changes.
  - version: '1.0'
    date: '2026-10-27'
    note: >-
      Initial release. Scores the interface of a predicted complex with ipSAE by running the upstream ipsae.py per id
      and parsing its score table; the formulas are not reimplemented. Takes structures and a per-id pae stream (npz in Boltz layout,
      json in ColabFold or AlphaFold3 layout). Emits ipsae (one row per id: binder_chain against the best of target_chains),
      ipsae_pairs (every chain-pair row) and missing. pdockq, pdockq2 and iptm_af are NaN when the PAE file carries no pLDDT or ipTM.

Peppr:
  files:
  - biopipelines/peppr.py
  - pipe_scripts/pipe_peppr.py
  current: "1.2"
  history:
  - version: '1.2'
    date: '2026-10-29'
    note: >-
      The failure for a ligand that cannot be matched names the ligand and what its bonds lack. Boltz2 predictions of a ligand given as SMILES have no bonds in the mmCIF (no `chem_comp_bond`, a residue name the dictionary does not know) and the PDB form carries only `CONECT` records, which give bonds of unknown order; both made peppr fail with `different entities or a different multiplicity`, which hides the cause. The `cause` now starts with the ligand and what is missing, and the documentation states which Boltz2 outputs work (the mmCIF of a ligand given by its CCD code does).
  - version: '1.1'
    date: '2026-10-29'
    note: >-
      The install check also imports biotite, and the shortcut for an existing env runs the same check (peppr, biotite, pandas, yaml); it accepted any env that existed. An existing env that fails the check is no longer built over, and the failure says to retry with `force_reinstall=True`.
  - version: '1.0'
    date: '2026-10-27'
    note: >-
      Initial release. Scores predicted structures against reference structures with the peppr package: backbone RMSD, TM-score, lDDT, lDDT-PLI, fnat, iRMSD, LRMSD and DockQ, one column each in a `peppr` table with one row per prediction. A single reference scores every prediction; several are matched by id, and a sibling id is not a match. A metric peppr cannot compute is NaN, and a prediction that cannot be evaluated at all is NaN throughout and recorded in `missing`. Runs in its own env, with biotite kept below 2.0.

RFD4Proteina:
  files:
  - biopipelines/rfd4proteina.py
  - pipe_scripts/pipe_rfd4proteina_inputs.py
  - pipe_scripts/pipe_rfd4proteina_postprocess.py
  - pipe_scripts/pipe_rfd4proteina_weights.py
  current: "1.3"
  history:
  - version: '1.3'
    date: '2026-10-29'
    note: >-
      The install check imports yaml, pandas and huggingface_hub, which the pipe scripts need, and looks up atomworks and rfproteina without importing them. It only found the rfd4-proteina distribution and its entry point.
  - version: '1.2'
    date: '2026-10-28'
    note: >-
      One input the contig did not fit (a residue range its chain lacks) stopped `rfd4-generate` at that example and lost every design after it, with the same generic cause recorded for all of them. Each prepared input is now built once through upstream's own `build_annotated_atom_array_from_condition_spec` before the run, so that input alone is a failure row carrying upstream's message (for example `Preserved segment 'A1-40' runs outside chain A, whose residues are 1-20.`) and the others are designed. The docstring also says which chain id a designed segment receives.
  - version: '1.1'
    date: '2026-10-28'
    note: >-
      A PDB input could not be converted: upstream's DISTILLATION preset loads standard annotations, which AtomWorks 3.0.4 refuses for a PDB (`load_standard_annotations=True is not supported for PDB files`), so every PDB failed at the input step. The converter turns that one flag off. The `metrics` table no longer carries the `input_json_path` column, a path to the condition spec that the documentation already counted among the dropped path columns.
  - version: '1.0'
    date: '2026-10-27'
    note: >-
      New tool: sequence-structure co-design with RFD4-Proteina (Baker Lab x NVIDIA, BSD-3-Clause code and weights) driven by its YAML condition spec. Implements protein binders (the upstream PPI recipe: target backbone as one internal-coordinate group, full target sequence, hotspots), small-molecule binders (ligand kept by a preserved contig segment) and indexed motif scaffolding; further conditions go through `conditions`, further Hydra options through forwarded keywords.

LigandDdG:
  files:
  - biopipelines/ligand_ddg.py
  - pipe_scripts/pipe_ligand_ddg.py
  - biopipelines/rosetta_scoring.py
  current: "1.2"
  history:
  - version: '1.2'
    date: '2026-10-28'
    note: >-
      New `seed` (default 42). PyRosetta seeds itself from /dev/urandom, so no run could be repeated. Each replicate of each structure is now seeded from
      `seed` with a distinct, fixed value (`rosetta_scoring.replicate_seed`), and the hard scheme once. The seed does not change the soft value on the five
      streptavidin complexes tried: ten seeds each gave one ddG to four decimals, because the repack of the interface reaches the same optimum, so
      `ddg_soft_std` is 0 and `replicates=1` gives the same number as 5; the documentation says so.
  - version: '1.1'
    date: '2026-10-28'
    note: >-
      The first cluster run found four faults. In the hard scheme PyRosetta's RosettaScripts parser rejected the protocol for lack of a PROTOCOLS section
      ("Missing child element(s)"), so every structure failed; the section is there now. The Ddg filter and the interface task operation took jump 1, which
      is the ligand's jump only when the binder chain carries no hetero residue: a crystal with glycerol on the protein chain measured the glycerol and gave
      -0.3 instead of -30. The ligand's own jump is read from the fold tree now (the movers' `jump` is a boolean and stays 1). A ligand with no atom within
      6 A of the binder chain, such as the copy that belongs to another chain of a crystal, was scored as an exact zero without a word; it is a failure of
      that structure now. And with `params_file`, a ligand whose atom names differ from the params was scored anyway, because Rosetta drops an atom it has
      no name for and the run is muted (-8.5 instead of -22.3 for biotin on streptavidin); the names are compared now and a mismatch is a failure. The
      documentation said hetero residues are dropped, but those on the binder chain are kept.
  - version: '1.0'
    date: '2026-10-27'
    note: >-
      Initial release. Protein-ligand binding energy with PyRosetta, one tool with a scoring choice between Chaperone's two blocks: "soft" (ligand_ddg_soft; repack the interface with beta_nov16, score with beta_nov16_soft, trimmed mean over replicates) and "hard" (ligand_ddg; the active steps of ddg_protocol.xml run through PyRosetta's RosettaScripts parser, Ddg filter with repack=0). The ligand is parameterized per structure from the compounds stream's SMILES (RDKit bond orders, Dimorphite-DL protonation at ph, unique element-first atom names) with Rosetta's molfile_to_params.py, which the install fetches because the PyRosetta wheel does not ship it; params_file supplies pre-made parameters instead. Rosetta energy units. One row per input structure, NaN on failure.

PPIDdG:
  files:
  - biopipelines/ppi_ddg.py
  - pipe_scripts/pipe_ppi_ddg.py
  - biopipelines/rosetta_scoring.py
  current: "1.1"
  history:
  - version: '1.1'
    date: '2026-10-28'
    note: >-
      New `seed` (default 42). PyRosetta seeds itself from /dev/urandom, so a rerun gave other numbers: barnase-barstar read -62.1, -64.4 and -64.3 in three
      identical one-replicate runs.Each replicate of each structure is now seeded from `seed` with a distinct, fixed value
      (`rosetta_scoring.replicate_seed`), so a run repeats exactly (seed 7 twice gave -66.7726 both times, seed 8 gave -62.6831) and the replicates of one
      run still differ.
  - version: '1.0'
    date: '2026-10-27'
    note: >-
      Initial release. Protein-protein binding energy with PyRosetta, mirroring the ppi_ddg block of Chaperone: FastRelax with optional coordinate constraints to the input, then ddG = score(complex) - score(binder chain translated 10 000 A away) with beta_nov16 and no repacking, mean and population standard deviation over independent replicates. Rosetta energy units. One row per input structure, NaN on failure. Runs in the new PyRosetta environment shared with LigandDdG; PyRosetta needs a commercial license outside academic use.

ESM2:
  files:
  - biopipelines/esm2.py
  - pipe_scripts/pipe_esm2.py
  - pipe_scripts/pipe_esm2_weights.py
  current: "1.1"
  history:
  - version: '1.1'
    date: '2026-10-29'
    note: >-
      The install check imports every module the pipe scripts import (numpy, pandas, yaml, torch, transformers, huggingface_hub). It imported only torch, transformers and huggingface_hub, so an env without numpy, pandas or pyyaml was reported as installed.
  - version: '1.0'
    date: '2026-10-28'
    note: >-
      Initial release. Runs the ESM-2 protein language model (Hugging Face transformers, facebook/esm2_t*_UR50D, 8M to 3B) on a
      sequences stream. Emits scores (id, length, pll, pll_per_residue: the pseudo-log-likelihood with every residue masked on its own,
      summed and averaged) and an embeddings stream (one npy per id, mean-pooled over the residue positions of the last hidden state).
      compute_pll and compute_embeddings switch each off. install(models=[...]) downloads each checkpoint at the Hub commit current at
      install time and records it in REVISION; runs load that local folder. Verified on the 8M checkpoint on CPU; larger sizes and GPU are untested.

RF3:
  files:
  - biopipelines/rf3.py
  - pipe_scripts/pipe_rf3_config.py
  - pipe_scripts/pipe_rf3_postprocess.py
  - biopipelines/nucleic_acids.py
  - pipe_scripts/pipe_axis_data.py
  current: "1.4"
  history:
  - version: '1.4'
    date: '2026-10-29'
    note: >-
      The `msas` lookup is the shared `MsaLookup` (exact id, `sequences.id`, legacy `<id>_msa`, then the sequence), and the per-tool copy is gone. An input with a protein chain that has no alignment used to be folded with that chain unaligned; it is skipped now, keeps a blank row of `confidence` and a `failure` row in `missing` under every id it declared, and the other inputs run.
  - version: '1.3'
    date: '2026-10-29'
    note: >-
      `n_recycles=1` is refused while early stopping is on: upstream takes the first recycle for the early-stopping check and has none left to fold with, so every input failed with `RuntimeError: Recycling generator produced no outputs`. With `early_stopping_plddt_threshold=0` one recycle is accepted.
  - version: '1.2'
    date: '2026-10-29'
    note: >-
      The `msas` stream was looked up by the `id` of its table rows, but MMseqs2, Boltz2 and AlphaFold name their rows `<id>_msa` and keep the protein id in `sequences.id`, so an alignment from MMseqs2 matched no chain: RF3 gave no chain an `msa_path` and folded single-sequence, where the default early-stopping threshold abandons it. The lookup is keyed by `id` and by `sequences.id`, so both naming schemes find their alignment.
  - version: '1.1'
    date: '2026-10-29'
    note: >-
      The shared foundry env spec keeps `atomworks[ml]<3` (atomworks 3.x moved `AtomSelectionStack`, so `rf3.inference_engines.rf3` did not import), and the install check imports that module instead of the bare `rf3` package.
  - version: '1.0'
    date: '2026-10-28'
    note: >-
      New tool: RoseTTAFold3 co-folding through Foundry's `rf3 fold`, taking the same input axes as Boltz2 and OpenFold3 (proteins, ssDNA, dsDNA, ssRNA, dsRNA, ligands, optional per-protein msas). One `rf3 fold` call predicts every complex, so the model loads once. Streams `structures` (cif) and `pae` (upstream's confidences JSON, which carries the full PAE matrix), tables `confidence` (plddt, ptm, iptm, pae, pde, has_clash, ranking_score, early_stopped, seed, sample) and `missing`. An input stopped by `early_stopping_plddt_threshold` (default 0.5, upstream's) is a `filter` row, not a failure. Runs in the `foundry` environment RFdiffusion3 builds, with its own weights folder.

