OpenMM:
  files:
  - biopipelines/openmm.py
  - pipe_scripts/pipe_openmm.py
  current: "3.2"
  history:
  - version: '3.2'
    date: '2026-09-11'
    note: >-
      `install()` no longer raises on a non-venv environment manager. The antechamber check built its PATH from `get_conda_env_root()`, which is defined only when `machine.env_manager.name` is `venv`, so a forced install raised `KeyError: venv_root is required` on the cluster, colab, container and local variants alike — every shipped config except daint. The check now uses the env run prefix there, as the tool's own runtime PATH helper already did.
  - version: '3.1'
    date: '2026-09-03'
    note: >-
      The documented `(TableInfo, "column")` column-reference form now binds. It was refused by the parameter's own validator even though the signature and the tool page advertise it; the value is normalized through the shared `resolve_table_reference` before validation, so the tuple and the `tool.tables.x.col` attribute form produce the identical `TABLE_REFERENCE:path:column`.
  - version: '3.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.
  - version: '2.0'
    date: '2026-09-02'
    note: >-
      Pass the ligand chemistry through instead of declaring an empty `compounds` placeholder. OpenMM accepts `ligand=` and its runtime reuses the input stream's residue codes (resolve_ligand_codes) rather than assigning its own, so the compounds stream is unchanged and belongs on the output — declaring it empty silently dropped the ligand chemistry, and a consumer testing `ligand.streams.compounds` (as BoltzGen does) saw nothing. The placeholder's format is also corrected from `sdf` to `csv` per the Ligand Contract.
  - version: '1.3'
    date: '2026-08-31'
    note: >-
      Excludes the covalently linked pair from the nonbonded terms, as a real bonded pair is. The restraint added a harmonic bond to an already-built system without touching NonbondedForce, so two heavy atoms held at 0.18 nm still saw each other through full Lennard-Jones and Coulomb -- a large spurious repulsion that dominated the reported energies and pulled the minimised geometry away from the adduct. The tether still supplies no angle or torsion terms across the junction and both molecules stay chemically saturated, which the docs now state precisely.
  - version: '1.2'
    date: '2026-08-31'
    note: >-
      Added ligand, ligand_charge_method, ligand_forcefield, covalent_anchor, covalent_k, covalent_length, covalent_max_distance, mobile_selection and frozen_selection. A bound ligand is parameterised from OpenFF/GAFF with AM1-BCC or NAGL charges rather than perceived from the PDB, charges are cached across poses of the same molecule, and mobile_selection / frozen_selection zero the mass of everything else so atoms are held immovable rather than merely restrained. Both selections accept a per-structure table column reference. Adds n_mobile_atoms and n_frozen_atoms to the energies table.
  - version: '1.1'
    date: '2026-06-30'
    note: >-
      Emits a warning when a container image is configured: this tool runs its model in-process (or dispatches host-env sub-processes) and does not support container execution; it runs in environment mode.

