Sequence:
  files:
  - biopipelines/sequence.py
  - pipe_scripts/pipe_sequence.py
  current: "1.1"
  history:
  - version: '1.1'
    date: '2026-10-29'
    note: >-
      A FASTA, CSV or Excel file named without a path is read from the sequences/ folder when the pipeline is configured, and its sequences were never checked against the alphabet of their type, while the same file given with a path was. `configure_inputs` now runs the same validation once the file is read, so a letter outside the alphabet (an `X`, a `U` in a protein, a digit) is refused at configuration whichever way the file is named.

Scripting:
  files:
  - biopipelines/scripting.py
  current: "1.4"
  history:
  - version: '1.4'
    date: '2026-10-27'
    note: >-
      `outputs.drop(id, cause="", kind="filter")` takes a `kind` from a controlled set: `"filter"` (a deliberate drop, excused by the completion check, the old and default behavior) and the new `"unmatched"` (a lookup that found no partner for the id), which is not excused, so the step is flagged like a failure; any other value raises. Every drop used to be recorded as `filter`, so a lookup that failed for most ids passed as a filter and the loss was silent. New `max_dropped` (a fraction in (0, 1], default None) fails the step when the distinct ids recorded through `outputs.drop` exceed that share of the distinct ids that entered, with both counts in the message; the outputs and the `missing` table are written first. The runner and the API module join the files mapped to the tool.
  - version: '1.3'
    date: '2026-10-13'
    note: >-
      The step copies the script it was given into `<step>/_configuration/` and runs that copy. `my_scripts/` is gitignored, so a run kept no record of which version of a helper produced its outputs, and a helper edited between submission and execution changed a step that had already been configured. The runner takes `--script-origin-dir` and puts the script's own folder on `sys.path`, so a helper importing a sibling module is unaffected.
  - version: '1.2'
    date: '2026-10-12'
    note: >-
      Docstring only: the `script` argument now names the scripts-folder lookup (bare filename resolved against `folders.infrastructure.scripts`, default `my_scripts/`). No change to resolution, generated scripts or outputs.
  - version: '1.1'
    date: '2026-09-02'
    note: >-
      Declares `USER_STREAM_NAMES = True`. A Scripting `configuration()` returns stream names chosen by the user's script, so the stream-name registry check cannot know them in advance. The format checks still apply. One declarative line; no change to generated scripts or outputs.
