StructureCluster:
  files:
  - biopipelines/structure_cluster.py
  - pipe_scripts/pipe_structure_cluster.py
  current: "1.1"
  history:
  - version: '1.1'
    date: '2026-07-29'
    note: >-
      Adds the cluster MEDOID alongside the representative. The representative
      is the best-scoring member (sphere exclusion visits in ranking order) and
      can sit at the edge of its own cluster; the medoid maximises mean
      similarity to the other members and is the family's most typical fold.
      New `medoid` column on `clusters` and `is_medoid` on `assignments`; a
      singleton is its own medoid. Measured on a 48-design campaign, 3 of 14
      families had a medoid different from the representative.
  - version: '1.0'
    date: '2026-07-28'
    note: >-
      New tool. Fold-similarity clustering of a structures stream by sphere
      exclusion over distance-matrix RMSD of length-normalised C-alpha traces,
      with per-cluster ranking on user-supplied metric columns.

Table:
  files:
  - biopipelines/table.py
  current: "1.1"
  history:
  - version: '1.1'
    date: '2026-09-02'
    note: >-
      Renames its `name` parameter to `table_name`, matching the existing `self.table_name` and the `tool.tables.<name>` handle. `name` is framework-reserved as the job name and was being captured, so the job name was silently lost. `name` remains a deprecated alias.

ThermoMPNN:
  files:
  - biopipelines/thermompnn.py
  - pipe_scripts/pipe_thermompnn.py
  current: "2.0"
  history:
  - version: '2.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.
  - version: '1.1'
    date: '2026-06-30'
    note: >-
      Container-mode execution: the heavy binary now runs inside the configured .sif via container_prefix() when a container image is set, or in the host env otherwise; host-side orchestration stays in the activated env.

UniProt:
  files:
  - biopipelines/uniprot.py
  - pipe_scripts/pipe_uniprot.py
  current: "1.1"
  history:
  - version: '1.1'
    date: '2026-09-02'
    note: >-
      Declare the empty `compounds` placeholder as `csv` rather than `sdf`, per the Ligand Contract: compounds carries chemistry in its map_table and never coordinate files. The `sdf` spelling came from the developer manual's tool template, which has been corrected. No runtime effect — the placeholder is empty — but the declaration now passes contract_enforcement.check_compounds_format.

