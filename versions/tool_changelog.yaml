RFdiffusion2:
  files:
  - biopipelines/rfdiffusion2.py
  current: "1.4"
  history:
  - version: '1.4'
    date: '2026-09-02'
    note: >-
      Documentation only: `Ligand(code=...)` in docstrings and user-facing error messages becomes `Ligand(codes=...)`, since the two parameters were unified and `code` is now a synonym that will soon be deprecated. No behavioural change; the version moves because the wrapper file did.
  - version: '1.3'
    date: '2026-09-02'
    note: >-
      Constructs its internal code-only `Ligand` with `codes=` rather than the now-deprecated `code=`. The bare-string `ligand="LIG"` shorthand is the documented form, so the deprecation notice it triggered named a call the user never made.
  - version: '1.2'
    date: '2026-09-02'
    note: >-
      Forwards constructor keywords it does not type onto the upstream command line, so an advanced user can reach an option the wrapper never curated. Declares `FORWARD_UNKNOWN_KWARGS` with its upstream CLI dialect — hydra `key=value` for the RFdiffusion family, argparse `--key value` for the MPNN family — and every forwarded key and value is validated at construction time through the same denylist as any other freeform string, then emitted double-quoted and echoed into the step log so a forwarded flag is visible rather than silent. A leftover key within the similarity cutoff of a real parameter name is reported as a probable misspelling naming the candidate, and still forwarded rather than dropped.
  - version: '1.1'
    date: '2026-06-30'
    note: >-
      Helper arguments moved from positional CLI into a JSON config file passed to the resolver script; generated bash changed, no user-facing parameter change.
HBDesigner:
  files:
  - biopipelines/hbdesigner.py
  - pipe_scripts/pipe_hbdesigner.py
  - pipe_scripts/pipe_hbdesigner_constraints.py
  current: "2.1"
  history:
  - version: '2.1'
    date: '2026-09-04'
    note: >-
      The per-input `run_hbdesigner` command is emitted as a bash array instead of through `eval`. `eval` re-parsed the assembled line, so `$OUT_DIR` -- which carries the stream id, and stream ids are validated nowhere -- could close its own quoting and run a second command: an id of `x";>PWNED;"` executed `>PWNED` and silently truncated `--out_dir`. Argument output is byte-identical for every ordinary input.
  - version: '2.0'
    date: '2026-09-02'
    note: >-
      Resolves the environment it installs into from the config instead of a hardcoded literal, so `environments:` finally redirects install as well as runtime. The literal moved to a declared `ENV_NAME` class attribute and is now used only under `env_manager: pip`; under a real manager a tool with no `environments:` entry raises at install time, naming the tool, variant and config file, rather than building one env and later activating another that does not exist. `env create` also passes `-n <env>`, without which a redirected env was created under the name in its own spec file.
  - version: '1.1'
    date: '2026-06-30'
    note: >-
      Helper arguments moved from positional CLI into a JSON config file passed to the resolver script; generated bash changed, no user-facing parameter change.
