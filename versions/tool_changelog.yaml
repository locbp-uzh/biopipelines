Panda:
  files:
  - biopipelines/panda.py
  - pipe_scripts/pipe_panda.py
  current: "1.5"
  history:
  - version: '1.5'
    date: '2026-09-22'
    note: >-
      A pool-mode rename declares its outputs honestly. `head(n)` fixes what the step DECLARES while a filter earlier in the chain decides how many rows there are, so the surplus slots named no upstream id and no id-matching tier could excuse them; the step was marked FAILED for files that correctly had nothing to contain (BinderDesign/tagged_binder_002, 23 of 30 slots unfilled in two streams; tagged_binder_short_002, all 30). The runtime now records each unfilled slot in missing.csv as kind=filter under the id it was declared by, and the wrapper passes its declared ids to the pipe script so the two cannot drift. The rename branch also emits the `<id>` file template instead of an explicit path list: an explicit path carries no owner id, which made every such stream structurally unexcusable, including by the upstream-filter path that already worked elsewhere.
  - version: '1.4'
    date: '2026-09-04'
    note: >-
      A lazy bracket that means a number now says `<#>` instead of `<N>`. Inside a bracket the token was already behaving as a wildcard -- the content is discarded, since a value unknown at configuration time cannot be narrowed there -- while outside a bracket `<N>` is the one-element set containing the letter N. Writing `<N>` for a number was therefore a lie that only happened to work. No behavioural change: the compiled regex is identical.
  - version: '1.3'
    date: '2026-09-04'
    note: >-
      No behavioural change. The grain depth calculation spelled its id_map inline as the retired `*_<S>` class; it now uses `id_map_utils.DEFAULT_ID_MAP`, so the pattern has one definition and does not need migrating again.
  - version: '1.2'
    date: '2026-08-31'
    note: >-
      A pooled value-based stream keeps its content: its table is copied to the map_table path, which IS its content table, rather than to tables/, and the runtime file-map builder skips value-based streams instead of overwriting them with an id/file map. The guard around the pool-target computation now reports what it caught rather than emptying the targets silently, which would re-introduce this loss with the regression test still passing.
  - version: '1.1'
    date: '2026-06-30'
    note: >-
      Panda.merge gains a `grain` parameter (finest/coarsest) selecting which input's provenance level drives the output rows; `how` now defaults to None (derived from grain).

OpenFold3:
  files:
  - biopipelines/openfold3.py
  - pipe_scripts/pipe_openfold3_config.py
  - pipe_scripts/pipe_openfold3_postprocess.py
  - biopipelines/nucleic_acids.py
  - pipe_scripts/pipe_axis_data.py
  current: "1.4"
  history:
  - version: '1.4'
    date: '2026-09-23'
    note: >-
      use_msa_server defaults to "on unless msas is given", as the docstring always said: with the old default of True, msas= alone raised. Passing use_msa_server=True together with msas is still refused.
  - version: '1.3'
    date: '2026-09-23'
    note: >-
      Declared ids and collected rows agree. With top_only=False the postprocess numbers every sample of every seed, so seeds=[100,101] with 3 samples writes _1.._6 while 3 were declared; the declaration now multiplies samples by seeds, and top_only=False with a runner_yaml and no num_diffusion_samples is refused because the count would be a guess. The postprocess walks the queries queries.json named instead of the folders on disk, so a query that failed before inference is recorded in missing.csv rather than vanishing. A csv msas stream is refused at configuration instead of on the node, an iterating axis with no records builds no query instead of raising IndexError, and install() skips rebuilding an existing env again (it still ensures the weights), where every install had recreated it.
  - version: '1.2'
    date: '2026-09-22'
    note: >-
      Two bugs a real cluster run exposed. The aggregated confidence JSON spells its keys
      avg_plddt, disorder and sample_ranking_score, not plddt/fraction_disordered/ranking_score,
      so three columns came back empty on the first run; the mapping is now read off a real
      output and the table gains gpde. And top_only kept the LOWEST-numbered sample rather than
      the best one -- upstream writes every sample and ranks them -- so the selection now
      maximizes sample_ranking_score, with seed and sample recorded so the result says which
      sample it chose.
  - version: '1.1'
    date: '2026-09-22'
    note: >-
      The install downloads the model parameters. Upstream documents them as fetched on first
      prediction; they are not -- run_openfold validates the checkpoint up front and refuses
      ("cowardly refusing to perform inference"), so a pipeline that installed cleanly died at
      its first query. setup_openfold --non-interactive now runs as part of the install, and
      before the already-installed short-circuit, or an env created by 1.0 would never acquire
      its weights.
  - version: '1.0'
    date: '2026-09-22'
    note: >-
      First release. Open-source co-folding of proteins, nucleic acids and ligands via the
      OpenFold Consortium reimplementation of AlphaFold3, Apache 2.0 with weights included. Takes
      the same six input axes as Boltz2 so the two are interchangeable, and expresses ligands
      through the same auth_ligand_field decision so both models receive identical chemistry for
      the same input. No affinity head and no covalent linkage: those stay Boltz2's. The whole
      batch folds in one process, since run_openfold takes a single JSON holding every query.

PDB:
  files:
  - biopipelines/pdb.py
  - pipe_scripts/pipe_pdb.py
  current: "1.6"
  history:
  - version: '1.6'
    date: '2026-09-23'
    note: >-
      An RCSB refusal (HTTP 400/403) is no longer retried three times with backoff; it is reported at once, naming the status. 429 and 5xx are still retried as transport failures, and a 404 still stops the build.
  - version: '1.5'
    date: '2026-09-22'
    note: >-
      An RCSB transport failure no longer aborts pipeline construction. Every exception from the
      entry lookup -- timeout, connection reset, 5xx, 429 -- became a ValueError that stopped the
      build, so an unrelated outage presented as a bad PDB id. The lookup now retries with
      exponential backoff and keeps the two answers distinct: a 404 is a fact about the id and
      still raises, anything else is a fact about the network and warns. The entry is also fetched
      once per check rather than twice.
  - version: '1.4'
    date: '2026-09-11'
    note: >-
      Map-table file column renamed to the canonical `file`: its `structures` map_table records the per-id file under `file`, not `file_path`.
  - version: '1.3'
    date: '2026-09-11'
    note: >-
      `chain="all"` declares its lazy ids as `<id>[_<?>]`, not `<id>[_<chain>]`. Under the 1.4.0 notation a slot inside a bracket is a literal value set, so `[_<chain>]` matched the literal text `_chain` and nothing else; the per-chain ids the tool actually produces were never selected. `[_<?>]` is the segment class the declaration always meant.
  - version: '1.2'
    date: '2026-09-02'
    note: >-
      Adds `Structure` as another name for this tool, matching the `structures` stream it emits and the fact that it accepts mmCIF as well as PDB. Outputs keep the original name, so a `Structure(...)` step still writes `001_PDB/`.
  - version: '1.1'
    date: '2026-09-02'
    note: >-
      Lazy upstream ids no longer crash the fetch. `pdb_ids`, `custom_ids` and `upstream_files` were expanded with `expand_ids` behind an "is this a pattern" guard and raised `LazyPatternError` on a `[...]` id; they are now partially expanded, leaving the upstream map_table to make them concrete. The upstream-map override also fires when an id is still lazy, not only when the row and id counts differ — with one lazy pattern and one upstream row the counts agreed, so the pattern was never resolved and the fetch failed.

