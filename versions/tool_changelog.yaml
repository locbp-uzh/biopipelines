    note: >-
      New tool: ProteinMPNN / LigandMPNN sequence design through Foundry's `mpnn` command, one call per structure so a bad backbone fails one id. Streams `sequences` and `designs` with ids `<structure>_<n>` and the `chains` contract of ProteinMPNN and LigandMPNN (upstream writes all chains of a design unseparated, so the chains are recovered from the written structure and a length disagreement is a failure, not a guess). Exposes model_type, num_sequences, num_batches, temperature, seed, structure_noise, designed/fixed residues and chains, omit and bias. Runs in the `foundry` environment RFdiffusion3 builds, with its own weights folder.

REINVENT4:
  files:
  - biopipelines/reinvent4.py
  - pipe_scripts/pipe_reinvent4.py
  current: "1.1"
  history:
  - version: '1.1'
    date: '2026-10-29'
    note: >-
      The install check also imports pandas, which the pipe script needs, beside `reinvent --version`, in the shortcut and in the final verification.
  - version: '1.0'
    date: '2026-10-28'
    note: >-
      Initial release. Samples molecules from a pretrained REINVENT 4 prior (its `sampling` run mode) with four generators: `reinvent` (de novo), `libinvent` (scaffold decoration; input scaffolds with `[*:0]` attachment points), `linkinvent` (linker design; input warhead pairs joined by `|`) and `mol2mol` (optimization; `similarity` picks one of the six ChEMBL priors or the PubChem prior). Emits a `compounds` stream (ids `<input id>_<n>`, input provenance in `compounds.id`), a `samples` table (NLL plus the columns REINVENT reports for the generator) and, for the generators with input, an `inputs` table with the yield per input. REINVENT runs once per input compound, because its output keeps the input only in the form given to the model and one unreadable input aborts a whole run. Not wrapped: transfer learning, staged learning, scoring, PepInvent, the transformer variants of LibInvent and LinkInvent. Installs into the dedicated `REINVENT4` env from a shallow clone with upstream's `install.py` and fetches ten priors from Zenodo record 15641297, md5-checked.

Protenix:
  files:
  - biopipelines/protenix.py
  - pipe_scripts/pipe_protenix_config.py
  - pipe_scripts/pipe_protenix_postprocess.py
  - pipe_scripts/pipe_protenix_weights.py
  - biopipelines/nucleic_acids.py
  - pipe_scripts/pipe_axis_data.py
  current: "1.6"
  history:
  - version: '1.6'
    date: '2026-10-29'
    note: >-
      The `msas` lookup is the shared `MsaLookup`, and the per-tool copy is gone. The cause of a skipped query reads `no alignment in msas for <id> (ids present: ...)`, and an alignment the model cannot read fails the query of the chain concerned instead of the whole step. The skipped-query file is read and written through `biopipelines_io`.
  - version: '1.5'
    date: '2026-10-29'
    note: >-
      The `msas` stream was looked up by the `id` of its table rows, but MMseqs2, Boltz2 and AlphaFold name their rows `<id>_msa` and keep the protein id in `sequences.id`, so an alignment from MMseqs2 matched no chain: Protenix skipped every query with `no alignment for this protein chain in the msas stream`. The lookup is keyed by `id` and by `sequences.id`, so both naming schemes find their alignment.
  - version: '1.4'
    date: '2026-10-29'
    note: >-
      The import-free install check also imports numpy and pandas, which the config and post-processing scripts need. protenix itself is still only looked up (distribution metadata and entry point), never imported.
  - version: '1.3'
    date: '2026-10-28'
    note: >-
      Every `protenix pred` died at its first import on a node without nvcc and `CUDA_HOME`: upstream's default fused layer norm (`LAYERNORM_TYPE=fast_layernorm`) is JIT-compiled through `torch.utils.cpp_extension` there, and the env carries only the pip CUDA wheels. The generated script now exports `LAYERNORM_TYPE=torch`, which upstream's `layers.py` reads to use the plain PyTorch layer norm and skip the import of the compiled one; an exported `LAYERNORM_TYPE` still wins.
  - version: '1.2'
    date: '2026-10-28'
    note: >-
      The install verification ran `protenix --version`, which imports the package; the import JIT-compiles a CUDA extension and fails on a node with no CUDA toolkit, so an install made on a CPU node was reported as failed. It now checks the package metadata and the entry point without importing protenix.
  - version: '1.1'
    date: '2026-10-28'
    note: >-
      The install fetched the CCD files through upstream's `runner.inference`, which imports the whole model stack and JIT-compiles a CUDA extension, so it failed on a node with no `CUDA_HOME`. The files are downloaded with the standard library now, from upstream's own URL table.
  - version: '1.0'
    date: '2026-10-28'
    note: >-
      Initial release. All-atom co-folding of proteins, nucleic acids and ligands with ByteDance's Protenix, default checkpoint protenix-v2 (about 464 M parameters). Takes the six input axes of Boltz2 and OpenFold3 with the same Each/Bundle semantics and the same CCD-versus-SMILES decision, an optional a3m msas stream passed as unpairedMsaPath (a chain without an alignment skips its query, since a missing path would make upstream search the server and overwrite the others), covalent_bonds as upstream's own list, and seeds and num_diffusion_samples with the structures counted as seeds times samples. Streams structures (cif) and pae (npz, key pae, Boltz layout, read from upstream's full-data JSON, which the wrapper then deletes), tables confidence (plddt, ptm, iptm, gpde, has_clash, disorder, ranking_score, seed, sample) and missing. One JSON per query in one folder, so one model load and a failure stays in its own file; upstream records a failed query in ERR/<id>.txt and exits 0, so that text becomes the cause in missing. The install downloads the CCD files and the checkpoint into ProtenixCache. The weights of protenix-v2 are described upstream as proprietary and non-redistributable, and upstream's download URL for them answered HTTP 403 on 2026-10-28 while the other checkpoints downloaded, so the install warns instead of failing when the checkpoint is refused. Contact and pocket constraints (only the older constraint checkpoint) and templates are not wired. x86-64 only: upstream pins triton==3.3.1, which has no aarch64 wheel.

FLOWR:
  files:
  - biopipelines/flowr.py
  - pipe_scripts/pipe_flowr.py
  current: "1.2"
  history:
  - version: '1.2'
    date: '2026-10-29'
    note: >-
      The install check imports pandas, yaml and rdkit, which the pipe script needs, together with upstream's entry module `flowr.gen.generate_from_pdb`.
  - version: '1.1'
    date: '2026-10-28'
    note: >-
      The first runs found that a crystal with alternate locations (3RY2, atomic resolution) failed upstream before any sampling: its reader looks the
      CONECT records up by atom serial and raised an IndexError. The reference run reads a copy of the structure without CONECT records now; the reference
      ligand is cut out of the original, so nothing else changes. The documentation also records what the hydrogen options did: `protonate_pocket` worked
      with `interaction` on streptavidin and failed in upstream's ProLIF step on factor Xa, and `protonate_ligands` failed on both structures tried because
      upstream swallows an RDKit KekulizeException in its pocket reading and returns no molecule.
  - version: '1.0'
    date: '2026-10-28'
    note: >-
      Initial release. Generates 3D ligands in a protein pocket with FLOWR (jule-c/flowr, Cremer et al.), one upstream `generate_from_pdb` run per input structure. The pocket is a ligand bound in the structure, given through the Ligand contract (`ligand`), or a chain-aware residue selection with a heavy-atom count (`pocket_residues`). `conditioning` holds atoms of the reference ligand fixed (interaction, functional_group, scaffold, linker or substructure); the checkpoint with explicit hydrogens, flexible pockets and the sampler options are not wired. Outputs a `compounds` stream, one SDF pose per molecule in a `structures` stream, a `pockets` table (molecules requested and returned) and `missing`; upstream writes no per-molecule score, so there is none. Runs in its own `FLOWR` env (torch 2.5.1, CUDA 11.8) and downloads `flowr_noHs.ckpt` from Zenodo record 15737419, verifying its md5.

Embedding:
  files:
  - biopipelines/embedding.py
  - pipe_scripts/pipe_embedding.py
  current: "1.1"
  history:
  - version: '1.1'
    date: '2026-10-29'
    note: >-
      The install check also imports numpy, pandas and yaml, which the pipe script needs, beside torch, torch_scatter, torch_geometric, einops and progres.
  - version: '1.0'
    date: '2026-10-29'
    note: >-
      Initial release. A model-agnostic embedder: every model is one entry of a registry in the module (input kind, formats, adapter, weights environment variable, upstream default weights, dimension, per-node module, extra reader arguments), and nothing else names a model. Registered now: progres and cirpin, the Progres family (C-alpha graph, six EGNN layers, a 128-number L2-normalized vector per structure, first chain only). The weights are a file path you supply and must exist at configuration time; the step exports it as TRAINED_MODEL_FP and loads it itself with weights_only=True, because the progres package's own load_trained_model takes no path and downloads its default data first. Emits an embeddings stream (one npy per id), an optional node_embeddings stream (residues x dimension, from the per-node decoder before pooling) and, for pairs given as two columns of one table, a similarities table (id, first, second, cosine_similarity; NaN and a failure row when a member has no embedding). The Progres and CIRPIN checkpoints load strictly into the pip package's network and the pipe script ran on them with progres 1.1.0 on CPU, with a sum-scatter standing in for the uncompiled torch_scatter; GPU, the cluster install and real structures are untested. Own Embedding env (torch 2.8.0+cu128 with the matching torch-scatter wheel, progres), no Daint entry.

Foldcomp:
  files:
