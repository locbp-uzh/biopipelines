    note: >-
      Documentation only: `Ligand(code=...)` in docstrings and user-facing error messages becomes `Ligand(codes=...)`, since the two parameters were unified and `code` is now a synonym that will soon be deprecated. No behavioural change; the version moves because the wrapper file did.
  - version: '1.3'
    date: '2026-09-02'
    note: >-
      Renames the code-only construction parameter from `code` to `codes`, since the singular was one letter away from it and silently handed back a chemistry-free stub when confused. `code` remains a deprecated alias. Adds `Compound` as another name for this tool, matching the `compounds` stream it emits; outputs keep the original name, so a `Compound(...)` step still writes `001_Ligand/`.
  - version: '1.2'
